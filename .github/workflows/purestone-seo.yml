name: PureStone SEO pages
on:
  push:
    branches: [main]
    paths:
      - 'manifest/products_manifest.js'
      - 'scripts/generate-purestone-seo.mjs'
      - '.github/workflows/purestone-seo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: purestone-seo-main
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate material pages
        run: node scripts/generate-purestone-seo.mjs
      - name: Commit generated pages
        run: |
          if git diff --quiet -- materiale sitemap.xml; then
            echo "No SEO changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materiale sitemap.xml
          git commit -m "chore: regenerate PureStone SEO pages [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
