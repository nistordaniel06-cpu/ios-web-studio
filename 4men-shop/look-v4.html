<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f0e"><title>Look-ul meu 4MEN</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f2f0e9;--paper:#fbfaf6;--ink:#0d0f0e;--muted:#747770;--line:rgba(13,15,14,.11);--lime:#b6ff63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.wrap{width:min(900px,calc(100% - 22px));margin:auto}.top{padding:20px 0;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.card{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.09)}.hero{background:#111;color:#fff;border-radius:23px;padding:28px}.hero small{color:#aaa;text-transform:uppercase;letter-spacing:.13em}.hero h1{font-size:clamp(42px,8vw,70px);line-height:.92;letter-spacing:-.06em;margin:12px 0}.hero p{color:#b9bcb8;line-height:1.7}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{background:#242725;border-radius:999px;padding:9px 12px;font-size:10px}.products{display:grid;gap:11px;margin-top:18px}.product{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;background:white;border:1px solid var(--line);border-radius:17px;padding:10px}.product img{width:90px;height:90px;object-fit:cover;border-radius:12px;background:#ddd}.product h3{margin:0 0 5px;font-size:17px}.product p{font-size:10px;color:var(--muted);margin:0;line-height:1.5}.btn{border:0;border-radius:999px;padding:13px 17px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center}.lime{background:var(--lime);color:#0b1108}.dark{background:#111;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.foot{padding:22px 0;color:#777;font-size:10px;text-align:center}@media(max-width:600px){.card{padding:14px}.hero{padding:22px 18px}.product{grid-template-columns:70px 1fr}.product img{width:70px;height:70px}.product .price{grid-column:2}}</style></head><body><div class="wrap"><div class="top"><div class="brand">4MEN <span style="color:#777">· Look</span></div><a href="./v4.html" style="color:inherit">Magazin</a></div><main class="card"><div id="state">Se încarcă rutina ta…</div></main><div class="foot">Link privat 4MEN · păstrează-l pentru a reveni la rutina ta.</div></div><script>const SB='https://bcedyacdepzhqwleizfl.supabase.co',KEY='sb_publishable_vrnEsnBHspLzL9pBxMuBzw_DBZ-1mgx';const sb=supabase.createClient(SB,KEY),token=new URLSearchParams(location.search).get('t')||'';const money=n=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:'RON'}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){if(!token){state.innerHTML='<p>Link invalid.</p>';return}const r=await sb.rpc('fourmen_public_look',{p_token:token});if(r.error||!r.data){state.innerHTML='<p>Rutina nu a fost găsită.</p>';return}const x=r.data,p=x.products||[];state.innerHTML=`<section class="hero"><small>Produsele folosite azi</small><h1>${esc(x.haircut_name||'Look-ul tău 4MEN')}</h1><p>${esc(x.notes||'Ține rutina aproape și recreează acasă look-ul făcut în salon.')}</p><div class="meta"><span class="pill">Barber: ${esc(x.barber_name||'4MEN')}</span><span class="pill">${new Date(x.session_date).toLocaleDateString('ro-RO')}</span></div></section><h2 style="margin-top:26px">Rutina ta</h2><div class="products">${p.map(z=>`<div class="product"><img src="${esc(z.image_url||'')}" alt="${esc(z.name)}"><div><h3>${esc(z.name)}</h3><p>${esc(z.usage_note||z.description||'Recomandat pentru look-ul tău.')}</p></div><b class="price">${money(z.price_ron)}</b></div>`).join('')}</div><div class="actions"><button class="btn lime" onclick='buyAll(${JSON.stringify(JSON.stringify(p)).replace(/'/g,"&#39;")})'>Adaugă toată rutina în coș</button><a class="btn dark" href="https://wa.me/?text=${encodeURIComponent('Rutina mea 4MEN: '+location.href)}">Trimite pe WhatsApp</a></div>`}function buyAll(raw){const p=JSON.parse(raw),cart=JSON.parse(localStorage.getItem('fourmenCartV4')||'[]');p.forEach(z=>{const e=cart.find(x=>x.id===z.id);if(e)e.qty++;else cart.push({id:z.id,name:z.name,price:Number(z.price_ron),qty:1})});localStorage.setItem('fourmenCartV4',JSON.stringify(cart));localStorage.setItem('fourmenStyleToken',token);location.href='./v4.html?t='+encodeURIComponent(token)+'#magazin'}load()</script></body></html>
