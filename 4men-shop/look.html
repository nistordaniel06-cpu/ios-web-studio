<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0c"><title>Look-ul meu — 4MEN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><style>:root{--bg:#f1efe8;--paper:#fbfaf6;--ink:#0b0d0c;--muted:#72766f;--line:rgba(11,13,12,.11);--lime:#b6ff63;--dark:#0b0d0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}.wrap{width:min(1050px,calc(100% - 26px));margin:auto}.display{font-family:'Manrope',sans-serif;letter-spacing:-.055em}a{text-decoration:none;color:inherit}.btn{border:0;border-radius:999px;padding:13px 17px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px}.btn-dark{background:#111;color:#fff}.btn-lime{background:var(--lime)}header{height:70px;border-bottom:1px solid var(--line);background:rgba(241,239,232,.88);backdrop-filter:blur(18px)}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border-radius:13px;background:#111;color:var(--lime);display:grid;place-items:center;font-weight:900}.brand b{font:800 19px 'Manrope'}.brand small{display:block;color:#777;font-size:8px;text-transform:uppercase;letter-spacing:.13em}.shell{padding:34px 0 70px}.hero{background:#111;color:#fff;border-radius:31px;padding:38px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(182,255,99,.12);right:-70px;top:-80px}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.17em;color:#888;font-weight:800}.hero h1{font-size:clamp(48px,7vw,82px);line-height:.92;margin:10px 0 15px;position:relative;z-index:1}.hero p{max-width:650px;color:#adb1aa;font-size:12px;line-height:1.7;position:relative;z-index:1}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;position:relative;z-index:1}.chip{border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 10px;font-size:9px;color:#ddd}.section{padding:34px 0}.section h2{font:800 38px 'Manrope';letter-spacing:-.05em;margin:0 0 18px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}.product img{width:100%;height:240px;object-fit:cover}.body{padding:17px}.body h3{font:700 21px 'Manrope';letter-spacing:-.04em;margin:5px 0}.body p{font-size:10px;color:#737770;line-height:1.55}.usage{background:#edf6df;border-radius:12px;padding:10px;font-size:9px;margin-top:10px}.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.foot b{font:800 16px 'Manrope'}.empty{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:25px;color:#777}.bottom{background:#ddd9cf;border-radius:25px;padding:27px;display:flex;align-items:center;justify-content:space-between;gap:20px}.bottom h3{font:700 28px 'Manrope';margin:0 0 5px}.bottom p{font-size:10px;color:#666;margin:0}@media(max-width:800px){.products{grid-template-columns:1fr 1fr}.hero{padding:29px 22px}.bottom{display:block}.bottom .btn{margin-top:16px}}@media(max-width:560px){.products{grid-template-columns:1fr}.hero h1{font-size:52px}.section h2{font-size:32px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="./v3.html"><span class="mark">4M</span><span><b>4MEN</b><small>Look-ul meu</small></span></a><a class="btn btn-dark" href="./v3.html">4MEN Shop</a></div></header><main class="wrap shell"><section id="hero" class="hero"><div class="eyebrow">Recomandarea barberului tău</div><h1 class="display">Se încarcă look-ul…</h1></section><section class="section"><h2>Produsele folosite pe tine</h2><div id="products" class="products"><div class="empty">Se încarcă…</div></div></section><section id="bottom" class="bottom" style="display:none"><div><h3>Vrei același rezultat acasă?</h3><p>Adaugă toate produsele în coș și continuă în 4MEN Shop.</p></div><button class="btn btn-lime" onclick="addAll()"><i data-lucide="shopping-bag"></i> Adaugă rutina în coș</button></section></main><script>const URL='https://bcedyacdepzhqwleizfl.supabase.co',KEY='sb_publishable_vrnEsnBHspLzL9pBxMuBzw_DBZ-1mgx';let look=null;const money=n=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:'RON'}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const token=new URLSearchParams(location.search).get('t');if(!token){fail('Link incomplet.');return}try{const r=await fetch(URL+'/rest/v1/rpc/fourmen_public_look',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});if(!r.ok)throw new Error('Nu am putut deschide recomandarea.');look=await r.json();if(!look){fail('Linkul nu mai este disponibil.');return}document.getElementById('hero').innerHTML=`<div class="eyebrow">Recomandarea barberului tău</div><h1 class="display">${look.customer_name?esc(look.customer_name)+', ':''}look-ul tău 4MEN.</h1><p>${esc(look.notes||'Am salvat produsele și pașii folosiți pentru look-ul tău, ca să îl poți recrea acasă.')}</p><div class="chips"><span class="chip">Barber: ${esc(look.barber_name)}</span>${look.haircut_name?`<span class="chip">${esc(look.haircut_name)}</span>`:''}<span class="chip">${new Date(look.session_date).toLocaleDateString('ro-RO')}</span></div>`;const ps=Array.isArray(look.products)?look.products:[];document.getElementById('products').innerHTML=ps.length?ps.map(p=>`<article class="product"><img src="${p.image_url||'https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=900&q=85'}" alt="${esc(p.name)}"><div class="body"><div class="eyebrow">${esc(p.category||'Grooming')}</div><h3>${esc(p.name)}</h3><p>${esc(p.description||'Produs recomandat de barberul tău.')}</p>${p.usage_note?`<div class="usage"><b>Cum l-am folosit:</b> ${esc(p.usage_note)}</div>`:''}<div class="foot"><b>${money(p.price_ron)}</b><button class="btn btn-dark" onclick="addOne('${p.id}')">Adaugă</button></div></div></article>`).join(''):'<div class="empty">Nu sunt produse atașate acestui look.</div>';document.getElementById('bottom').style.display=ps.length?'flex':'none';lucide.createIcons()}catch(e){fail(e.message||'A apărut o eroare.')}}function fail(m){document.getElementById('hero').innerHTML=`<div class="eyebrow">4MEN</div><h1 class="display">Link indisponibil.</h1><p>${esc(m)}</p>`;document.getElementById('products').innerHTML='<div class="empty">Poți reveni în 4MEN Shop sau cere barberului un link nou.</div>'}function addOne(id){const p=(look?.products||[]).find(x=>x.id===id);if(!p)return;let c=JSON.parse(localStorage.getItem('fourmen_cart_v3')||'[]');const x=c.find(i=>i.id===id);if(x)x.quantity=Math.min(Number(p.stock||99),Number(x.quantity||1)+1);else c.push({id:p.id,name:p.name,price:Number(p.price_ron),image:p.image_url,quantity:1});localStorage.setItem('fourmen_cart_v3',JSON.stringify(c));location.href='./v3.html#magazin'}function addAll(){(look?.products||[]).forEach(p=>{let c=JSON.parse(localStorage.getItem('fourmen_cart_v3')||'[]');const x=c.find(i=>i.id===p.id);if(x)x.quantity=Math.min(Number(p.stock||99),Number(x.quantity||1)+1);else c.push({id:p.id,name:p.name,price:Number(p.price_ron),image:p.image_url,quantity:1});localStorage.setItem('fourmen_cart_v3',JSON.stringify(c))});location.href='./v3.html#magazin'}load();lucide.createIcons();</script></body></html>
