<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Compară materiale • PureStone</title><meta name="description" content="Compară materiale PureStone după brand, culoare, finisaj, grosime și preț orientativ."><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><script src="./manifest/products_manifest.js"></script><script src="./purestone-runtime.js"></script><style>:root{--bg:#f4efe7;--paper:#fbf8f3;--ink:#201d19;--muted:#7b7369;--line:rgba(32,29,25,.12);--gold:#a48058;--dark:#211e1a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:DM Sans,sans-serif}.wrap{width:min(1240px,calc(100% - 28px));margin:auto}.serif{font-family:Playfair Display,serif}.top{position:sticky;top:0;z-index:20;background:rgba(244,239,231,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Playfair Display,serif;letter-spacing:.15em;font-weight:600;text-decoration:none;color:inherit}.btn{border:0;border-radius:999px;padding:11px 15px;background:var(--dark);color:#fff;text-decoration:none;font-weight:700}.hero{padding:42px 0 22px}.hero h1{font-size:clamp(48px,7vw,82px);line-height:.92;margin:8px 0 15px}.hero p{color:var(--muted);max-width:700px;line-height:1.7}.selectors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.selectors select{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px;background:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:80px}.card{background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:26px;overflow:hidden}.media{height:300px;background:#d4c8b8}.media img{width:100%;height:100%;object-fit:cover}.body{padding:22px}.eyebrow{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}.body h2{font-family:Playfair Display,serif;font-size:34px;line-height:1;margin:8px 0 14px}.facts{border-top:1px solid var(--line);margin-top:18px}.fact{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:11px}.fact span{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.light{background:white;color:var(--ink);border:1px solid var(--line)}.quote{position:sticky;bottom:12px;margin:0 auto 18px;width:min(680px,calc(100% - 28px));background:rgba(33,30,26,.94);color:white;border-radius:22px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.2)}.quote small{opacity:.7}.quote a{background:#fff;color:#211e1a;border-radius:999px;padding:10px 14px;font-weight:700;text-decoration:none;white-space:nowrap}@media(max-width:780px){.selectors{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.media{height:360px}.hero{padding-top:28px}.quote{bottom:max(10px,env(safe-area-inset-bottom));align-items:flex-start}.quote a{font-size:10px}.body h2{font-size:31px}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="./purestone.html">PURESTONE</a><a class="btn" href="./catalog.html">Catalog</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Compară înainte să alegi</div><h1 class="serif">Pune materialele<br>unul lângă altul.</h1><p>Alege până la trei suprafețe și compară datele importante înainte să ceri oferta sau să le vezi în bucătăria ta.</p></section><section class="selectors" id="selectors"></section><section class="grid" id="grid"></section></main><div class="quote"><div><b id="quoteCount">3 materiale selectate</b><br><small>Trimite selecția într-o singură cerere.</small></div><a id="quoteBtn" href="./quote.html">Cere ofertă →</a></div><script>const base=(typeof TOP_BLAT_CATALOG!=='undefined'&&Array.isArray(TOP_BLAT_CATALOG))?TOP_BLAT_CATALOG:[],G='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-image';let all=base,selected=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fallback(n){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#c8b49c"/><text x="60" y="700" font-family="Georgia" font-size="48" fill="white">${String(n).replace(/[<>&]/g,'')}</text></svg>`)}function image(p){const src=p.image_url||p.remote_images?.[0]||'';return src?(window.PureStoneRuntime?.proxiedImage(src,p.title)||src):fallback(p.title)}function options(sel){return all.map(p=>`<option value="${esc(p.slug)}" ${p.slug===sel?'selected':''}>${esc(p.title)} — ${esc(p.brand||'')}</option>`).join('')}function syncUrl(){const q=selected.filter(Boolean).join(',');history.replaceState(null,'','?slugs='+encodeURIComponent(q));document.querySelector('#quoteBtn').href='./quote.html?slugs='+encodeURIComponent(q);document.querySelector('#quoteCount').textContent=selected.filter(Boolean).length+' materiale selectate'}function render(){document.querySelector('#selectors').innerHTML=[0,1,2].map(i=>`<select data-i="${i}">${options(selected[i])}</select>`).join('');document.querySelectorAll('select[data-i]').forEach(s=>s.onchange=()=>{selected[+s.dataset.i]=s.value;syncUrl();render()});const products=selected.map(s=>all.find(p=>p.slug===s)).filter(Boolean);document.querySelector('#grid').innerHTML=products.map(p=>`<article class="card"><div class="media"><img src="${esc(image(p))}" alt="${esc(p.title)}"></div><div class="body"><div class="eyebrow">${esc(p.brand||'PureStone')} • ${esc(p.material||'Material premium')}</div><h2>${esc(p.title)}</h2><div class="facts"><div class="fact"><span>Culoare</span><b>${esc(p.color_family||'—')}</b></div><div class="fact"><span>Finisaj</span><b>${esc(p.finish||'La cerere')}</b></div><div class="fact"><span>Grosime</span><b>${esc(p.thickness||'La cerere')}</b></div><div class="fact"><span>Dimensiune placă</span><b>${esc(p.slab_size||'La cerere')}</b></div><div class="fact"><span>Preț</span><b>${esc(p.price_label||'Ofertă personalizată')}</b></div></div><p style="color:var(--muted);font-size:11px;line-height:1.6">${esc(p.furniture_pairing||'Potrivit pentru proiecte premium la comandă.')}</p><div class="actions"><a class="btn light" href="./product.html?slug=${encodeURIComponent(p.slug)}">Detalii</a><a class="btn" href="./kitchen-visualizer.html?slug=${encodeURIComponent(p.slug)}">Vezi în bucătăria mea</a></div></div></article>`).join('');document.querySelectorAll('.media img').forEach(i=>i.onerror=()=>{i.onerror=null;i.src=fallback(i.alt)});syncUrl()}async function init(){if(window.PureStoneRuntime){const o=await PureStoneRuntime.loadOverrides();all=PureStoneRuntime.mergeCatalog(base,o)}const params=new URLSearchParams(location.search),from=params.get('slugs')?.split(',').filter(Boolean)||[];const favs=JSON.parse(localStorage.getItem('purestone-favorites')||'[]');selected=[...from,...favs,...all.slice(0,3).map(x=>x.slug)].filter((v,i,a)=>v&&a.indexOf(v)===i).slice(0,3);while(selected.length<3&&all[selected.length])selected.push(all[selected.length].slug);render();PureStoneRuntime?.track('compare_open',{count:selected.length})}init();</script></body></html>
