<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBlat V2 — Compară materiale</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="app" data-shell></div><script src="app.js"></script><script>
shell('compare');
(async()=>{const page=document.getElementById('page'),all=await loadCatalog();let ids=read(K.cmp);if(!ids.length)ids=all.slice(0,3).map(x=>x.id);const picks=ids.map(id=>all.find(x=>x.id===id)).filter(Boolean).slice(0,3);const cells=(fn)=>picks.map(fn).join('');page.innerHTML=`<div class="page-head"><div><div class="eyebrow">Decision tool</div><h1>Compară materiale.</h1><p>Alege până la 3 materiale și vezi diferențele fără să sari între pagini.</p></div><a class="btn dark" href="materiale.html">+ Alege materiale</a></div>${picks.length?`<section class="compare-grid">${picks.map(p=>`<article class="compare-card"><img src="${p.thumbnail_url||p.master_image_url}" alt="${p.title}"><div class="body"><div class="eyebrow">${p.brand}</div><h2>${p.title}</h2><div class="muted small">${p.material}</div><div class="detail-price" style="font-size:17px">${p.price}</div><a class="btn" href="material.html?id=${p.id}">Detalii →</a> <button class="btn" data-remove="${p.id}">Elimină</button></div></article>`).join('')}</section><section class="compare-table"><div class="compare-row"><div class="label">Criteriu</div>${cells(p=>`<div><b>${p.title}</b></div>`)}</div><div class="compare-row"><div class="label">Brand</div>${cells(p=>`<div>${p.brand||'—'}</div>`)}</div><div class="compare-row"><div class="label">Material</div>${cells(p=>`<div>${p.material||'—'}</div>`)}</div><div class="compare-row"><div class="label">Preț catalog</div>${cells(p=>`<div><b>${p.price||'—'}</b></div>`)}</div><div class="compare-row"><div class="label">Mostră</div>${cells(p=>`<div><button class="btn" data-sample="${p.id}">Solicită</button></div>`)}</div><div class="compare-row"><div class="label">Ofertă</div>${cells(p=>`<div><a class="btn dark" href="quote.html?id=${p.id}">Calculează →</a></div>`)}</div></section>`:'<div class="empty">Nu ai materiale selectate. Intră în catalog și apasă „Compară”.</div>'}`;page.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{write(K.cmp,read(K.cmp).filter(x=>x!==Number(b.dataset.remove)));location.reload()});page.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>{let a=read('eblatV2Samples');const id=Number(b.dataset.sample);if(!a.includes(id))a.push(id);write('eblatV2Samples',a);toast('Mostră solicitată')})})();
</script></body></html>
