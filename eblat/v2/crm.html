<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBlat V2 — Partner CRM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="app" data-shell></div><script src="app.js"></script><script>
shell('crm');
(function(){const page=document.getElementById('page');function render(){const partners=read(K.partners),projects=read(K.proj),sales=partners.reduce((s,p)=>s+Number(p.value||0),0);page.innerHTML=`<div class="page-head"><div><div class="eyebrow">Partner network</div><h1>CRM parteneri.</h1><p>Designeri, arhitecți și ateliere de mobilier — de la prospect la partener activ.</p></div><button class="btn dark" id="add">+ Partener</button></div><section class="cards"><div class="metric"><small>Parteneri</small><strong>${partners.length}</strong><div class="delta">în pipeline</div></div><div class="metric"><small>Activi</small><strong>${partners.filter(p=>p.stage==='Activ').length}</strong><div class="delta">colaborări curente</div></div><div class="metric"><small>Valoare generată</small><strong>${money(sales)}</strong><div class="delta">demo CRM</div></div><div class="metric"><small>Comision 5%</small><strong>${money(sales*.05)}</strong><div class="delta">potențial parteneri</div></div></section><div class="section-head"><div><h2>Pipeline</h2><p>Mută partenerii între etape din formularul rapid.</p></div></div><section class="crm-grid">${['Prospect','Contactat','Onboarding','Activ'].map(stage=>`<div class="crm-col"><h3>${stage}</h3>${partners.filter(p=>p.stage===stage).map(p=>`<article class="partner"><b>${p.name}</b><p>${p.type}</p><div class="value">${money(p.value||0)}</div><div style="display:flex;gap:5px;margin-top:8px"><button class="btn" style="padding:6px 8px;font-size:9px" data-next="${p.id}">Avansează</button><button class="btn" style="padding:6px 8px;font-size:9px" data-del="${p.id}">Șterge</button></div></article>`).join('')||'<div class="small muted">Niciun partener.</div>'}</div>`).join('')}</section><div class="section-head"><div><h2>Proiecte atribuite</h2><p>În producție, fiecare proiect va avea partener, comision și istoric complet.</p></div></div><section class="pipeline">${projects.map(p=>`<article class="pipe"><div class="topline"><h3>${p.name}</h3><span class="money">${money(p.value)}</span></div><p>${p.client} · ${p.city}</p><span class="status ${statusClass(p.status)}">${p.status}</span></article>`).join('')}</section>`;document.getElementById('add').onclick=()=>{const name=prompt('Nume studio / firmă:');if(!name)return;const type=prompt('Tip: Designer / Arhitect / Mobilier','Designer')||'Designer';const a=read(K.partners);a.push({id:Date.now(),name,type,stage:'Prospect',value:0});write(K.partners,a);render()};page.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{const stages=['Prospect','Contactat','Onboarding','Activ'],a=read(K.partners),p=a.find(x=>x.id===Number(b.dataset.next));if(p)p.stage=stages[Math.min(stages.length-1,stages.indexOf(p.stage)+1)];write(K.partners,a);render()});page.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{write(K.partners,read(K.partners).filter(x=>x.id!==Number(b.dataset.del)));render()})}render()})();
</script></body></html>
