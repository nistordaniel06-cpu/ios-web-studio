<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151719"><title>eBlat OS V2 — Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="app" data-shell></div><script src="app.js"></script><script>
shell('dashboard');
(async()=>{const page=document.getElementById('page'),products=await loadCatalog(),projects=read(K.proj),partners=read(K.partners),quotes=read(K.quotes);const sales=projects.reduce((s,p)=>s+Number(p.value||0),0),rate=.05,earned=sales*rate,available=projects.filter(p=>p.progress>=6).reduce((s,p)=>s+Number(p.value||0)*rate,0);const sw=products.slice(0,4);page.innerHTML=`<div class="page-head"><div><div class="eyebrow">eBlat OS · V2</div><h1>Bună, Daniel.</h1><p>Proiecte, materiale, ofertare și parteneri B2B într-un singur flux.</p></div><a class="btn dark" href="quote.html">+ Creează ofertă</a></div><section class="cards"><div class="metric"><small>Proiecte active</small><strong>${projects.length}</strong><div class="delta">pipeline B2B</div></div><div class="metric"><small>Catalog</small><strong>${products.length}</strong><div class="delta">produse Top-Blat</div></div><div class="metric"><small>Parteneri</small><strong>${partners.length}</strong><div class="delta">CRM demo</div></div><div class="metric"><small>Oferte create</small><strong>${quotes.length}</strong><div class="delta">salvate local</div></div></section><section class="hero-grid"><article class="hero-card project-hero"><div class="project-photo" style="background-image:url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1200&q=85')"></div><div class="project-info"><span class="tag">${projects[0]?.status||'ÎN LUCRU'}</span><h2>${projects[0]?.name||'Vila Pipera'}</h2><div class="muted small">${projects[0]?.city||'București'} · ${money(projects[0]?.value||0)}</div>${progressBars(projects[0]?.progress||4)}<div class="small muted">Ofertă · Confirmat · Măsurare · Producție · Transport · Montaj</div><div style="display:flex;gap:7px;margin-top:16px"><a class="btn dark" href="materiale.html">Alege materiale</a><button class="btn" id="notify">Preview notificare</button></div></div></article><article class="hero-card wallet"><div class="eyebrow" style="color:#caa989">Partner Wallet</div><div class="balance">${money(earned)}</div><small>Comision estimat la 5% din proiectele din demo</small><div class="wallet-row"><div class="wallet-mini"><small>Disponibil</small><b>${money(available)}</b></div><div class="wallet-mini"><small>În așteptare</small><b>${money(Math.max(0,earned-available))}</b></div></div><div class="wallet-row"><div class="wallet-mini"><small>Vânzări generate</small><b>${money(sales)}</b></div><div class="wallet-mini"><small>Rată partener</small><b>5%</b></div></div></article></section><div class="section-head"><div><h2>Pipeline proiecte</h2><p>Statusul live al lucrărilor.</p></div><a class="btn" href="quote.html">+ ofertă nouă</a></div><section class="pipeline">${projects.map(p=>`<article class="pipe"><div class="topline"><h3>${p.name}</h3><span class="money">${money(p.value)}</span></div><p>${p.client} · ${p.city}</p><span class="status ${statusClass(p.status)}">${p.status}</span>${progressBars(p.progress)}</article>`).join('')}</section><div class="section-head"><div><h2>Selecție rapidă din catalog</h2><p>Produse reale din exportul Top-Blat.</p></div><a class="btn" href="materiale.html">Vezi toate →</a></div><section class="products">${sw.map(productCard).join('')}</section>`;bindProductActions(page);document.getElementById('notify').onclick=()=>toast(`Vila Pipera a intrat în producție. Designerul primește update automat.`)})();
</script></body></html>
