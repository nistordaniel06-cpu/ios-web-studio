<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBlat V2 — Detaliu material</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="app" data-shell></div><script src="app.js"></script><script>
shell('materials');
(async()=>{const page=document.getElementById('page'),all=await loadCatalog(),id=Number(parseViewParam().get('id'))||all[0]?.id,p=all.find(x=>x.id===id)||all[0];if(!p){page.innerHTML='<div class="empty">Produs indisponibil.</div>';return}document.title=`${p.title} — eBlat V2`;const fav=read(K.fav).includes(p.id),cmp=read(K.cmp).includes(p.id);page.innerHTML=`<div class="page-head"><div><div class="eyebrow">${p.brand||'eBlat'}</div><h1>${p.title}</h1><p>${p.material||''}</p></div><a class="btn" href="materiale.html">← Înapoi la catalog</a></div><section class="detail"><div class="slab"><img src="${p.master_image_url||p.thumbnail_url}" alt="${p.title}"></div><article class="detail-info"><span class="tag">${p.material||'Material premium'}</span><h1>${p.title}</h1><div class="muted">${p.brand||''}</div><div class="detail-price">${p.price||'La cerere'}</div><div class="detail-actions"><button class="btn ${fav?'sand':''}" id="fav">${fav?'♥ Salvat':'♡ Favorite'}</button><button class="btn" id="cmp">${cmp?'✓ În comparație':'⇄ Compară'}</button><button class="btn dark" id="sample">Solicită mostră</button><a class="btn sand" href="quote.html?id=${p.id}">Cere ofertă →</a></div><div class="specs"><div class="spec"><small>Brand</small><b>${p.brand||'—'}</b></div><div class="spec"><small>Material</small><b>${p.material||'—'}</b></div><div class="spec"><small>Preț catalog</small><b>${p.price||'—'}</b></div><div class="spec"><small>Sursă</small><b>Top-Blat export</b></div></div><div class="notice">Prețul afișat este cel din catalogul importat în repository. Oferta finală depinde de debitare, canturi, decupaje, măsurători, transport și montaj.</div></article></section><section class="visualizer"><div class="section-head" style="margin-top:0"><div><h2>Vezi materialul în bucătărie</h2><p>Previzualizare conceptuală V2, pentru alegerea direcției vizuale.</p></div></div><div class="kitchen"><div class="counter-overlay" style="background-image:url('${p.master_image_url||p.thumbnail_url}')"></div></div></section>`;favBtn=()=>{let a=read(K.fav);a=a.includes(p.id)?a.filter(x=>x!==p.id):[...a,p.id];write(K.fav,a);fav.classList.toggle('sand');fav.textContent=a.includes(p.id)?'♥ Salvat':'♡ Favorite';toast(a.includes(p.id)?'Material salvat':'Material scos din favorite')};document.getElementById('fav').onclick=favBtn;document.getElementById('cmp').onclick=()=>{let a=read(K.cmp);if(a.includes(p.id))a=a.filter(x=>x!==p.id);else if(a.length<3)a.push(p.id);else return toast('Poți compara maximum 3 materiale');write(K.cmp,a);document.getElementById('cmp').textContent=a.includes(p.id)?'✓ În comparație':'⇄ Compară';toast('Selecția de comparație a fost actualizată')};document.getElementById('sample').onclick=()=>{const s=read('eblatV2Samples');if(!s.includes(p.id)){s.push(p.id);write('eblatV2Samples',s)}toast('Mostra a fost adăugată în cereri')};})();
</script></body></html>
