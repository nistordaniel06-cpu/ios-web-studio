<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBlat V2 — Materiale</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="app" data-shell></div><script src="app.js"></script><script>
shell('materials');
(async()=>{const page=document.getElementById('page'),all=await loadCatalog(),params=parseViewParam();page.innerHTML=`<div class="page-head"><div><div class="eyebrow">Catalog real</div><h1>Materiale.</h1><p>${all.length} produse din exportul Top-Blat, într-o interfață de selecție pentru proiecte.</p></div><a class="btn dark" href="compare.html">Compară selecția →</a></div><div class="toolbar"><input id="q" placeholder="Caută Calacatta, Silestone, Atlas Plan..."><select id="mat"><option value="">Toate materialele</option></select><select id="brand"><option value="">Toate brandurile</option></select><select id="sort"><option value="name">A–Z</option><option value="low">Preț crescător</option><option value="high">Preț descrescător</option></select></div><div class="small muted" id="count"></div><section class="products" id="grid" style="margin-top:12px"></section><div style="text-align:center;margin-top:20px"><button class="btn" id="more">Arată mai multe</button></div>`;const qEl=document.getElementById('q'),matEl=document.getElementById('mat'),brandEl=document.getElementById('brand'),sortEl=document.getElementById('sort'),countEl=document.getElementById('count'),gridEl=document.getElementById('grid'),moreEl=document.getElementById('more');const mats=[...new Set(all.map(x=>x.material).filter(Boolean))].sort(),brands=[...new Set(all.map(x=>x.brand).filter(Boolean))].sort();matEl.innerHTML+=mats.map(x=>`<option>${x}</option>`).join('');brandEl.innerHTML+=brands.map(x=>`<option>${x}</option>`).join('');qEl.value=params.get('q')||'';let limit=24;function render(){let arr=all.filter(p=>(!qEl.value||`${p.title} ${p.brand} ${p.material}`.toLowerCase().includes(qEl.value.toLowerCase()))&&(!matEl.value||p.material===matEl.value)&&(!brandEl.value||p.brand===brandEl.value));if(sortEl.value==='low')arr.sort((a,b)=>num(a.price)-num(b.price));else if(sortEl.value==='high')arr.sort((a,b)=>num(b.price)-num(a.price));else arr.sort((a,b)=>a.title.localeCompare(b.title,'ro'));countEl.textContent=`${arr.length} rezultate`;gridEl.innerHTML=arr.slice(0,limit).map(productCard).join('')||'<div class="empty">Nu am găsit materiale pentru filtrele selectate.</div>';moreEl.style.display=arr.length>limit?'inline-block':'none';bindProductActions(gridEl)}[qEl,matEl,brandEl,sortEl].forEach(x=>x.oninput=()=>{limit=24;render()});moreEl.onclick=()=>{limit+=24;render()};render()})();
</script></body></html>
