<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBlat V2 — Ofertare asistată</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>@media print{.side,.top,.mobile-nav,.no-print{display:none!important}.app{display:block}.content{padding:0}.form-card{display:none}.quote-layout{display:block}.estimate{border:0}.notice{display:none}}</style></head><body><div class="app" data-shell></div><script src="app.js"></script><script>
shell('quote');
(async()=>{const page=document.getElementById('page'),all=await loadCatalog(),projects=read(K.proj),pid=Number(parseViewParam().get('id'))||all[0]?.id;page.innerHTML=`<div class="page-head"><div><div class="eyebrow">eBlat Quote AI · demo</div><h1>Ofertare asistată.</h1><p>Încarcă o schiță sau completează cotele. V2 pregătește o simulare comercială, nu o ofertă finală de producție.</p></div><button class="btn no-print" id="printBtn">Print / PDF white-label</button></div><section class="quote-layout"><article class="form-card"><div class="section-head" style="margin-top:0"><div><h2>Date proiect</h2><p>Poți porni de la un proiect sau de la un material.</p></div></div><div class="form"><div class="field"><label>Proiect</label><select id="project"><option value="">Proiect nou</option>${projects.map(p=>`<option>${p.name}</option>`).join('')}</select></div><div class="field"><label>Client / referință</label><input id="client" placeholder="ex. Vila Pipera"></div><div class="field full"><label>Material</label><select id="product">${all.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${p.title} — ${p.price}</option>`).join('')}</select></div><div class="field"><label>Lungime totală blat (m)</label><input id="len" type="number" step="0.1" value="4.2"></div><div class="field"><label>Adâncime medie (m)</label><input id="depth" type="number" step="0.01" value="0.62"></div><div class="field"><label>Backsplash (mp)</label><input id="backsplash" type="number" step="0.1" value="0.8"></div><div class="field"><label>Decupaje</label><input id="cuts" type="number" min="0" value="2"></div><div class="field"><label>Transport + montaj</label><select id="install"><option value="1">Inclus în simulare</option><option value="0">Fără</option></select></div><div class="field"><label>Marjă/discount partener</label><select id="partner"><option value="0">Preț catalog</option><option value=".04">4% partner</option><option value=".05" selected>5% PRO</option><option value=".06">6% Elite</option></select></div><div class="field full"><label>Schiță / randare (demo local)</label><input id="fileInput" type="file" accept="image/*,.pdf"></div><div class="field full"><button class="btn dark" id="analyzeBtn" type="button">✦ Analizează proiectul</button></div></div><div class="notice" id="analysis">În versiunea GitHub, analiza AI este simulată. În producție o legăm la backend pentru PDF/DWG/JPG, extracție cote și verificare tehnică.</div></article><article class="estimate"><div class="eyebrow">Ofertă orientativă eBlat PRO</div><h2 id="offerTitle" style="font:600 31px 'Playfair Display';margin:9px 0">Proiect nou</h2><div id="prodName" class="muted small"></div><div class="total" id="total">—</div><div class="breakdown"><div class="break"><span>Suprafață estimată</span><b id="area">—</b></div><div class="break"><span>Material</span><b id="materialCost">—</b></div><div class="break"><span>Decupaje / prelucrări</span><b id="cutCost">—</b></div><div class="break"><span>Transport + montaj</span><b id="installCost">—</b></div><div class="break"><span>Beneficiu partener</span><b id="partnerValue">—</b></div></div><div class="notice">Estimare V2. Prețul final se confirmă numai după verificarea materialului, cotelor, canturilor, decupajelor, disponibilității și condițiilor de montaj.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px" class="no-print"><button class="btn dark" id="saveBtn">Salvează ofertă</button><button class="btn" id="waBtn">Preview WhatsApp</button></div></article></section>`;const projectEl=document.getElementById('project'),clientEl=document.getElementById('client'),productEl=document.getElementById('product'),lenEl=document.getElementById('len'),depthEl=document.getElementById('depth'),backsplashEl=document.getElementById('backsplash'),cutsEl=document.getElementById('cuts'),installEl=document.getElementById('install'),partnerEl=document.getElementById('partner'),fileEl=document.getElementById('fileInput'),analysisEl=document.getElementById('analysis'),offerTitleEl=document.getElementById('offerTitle'),prodNameEl=document.getElementById('prodName'),totalEl=document.getElementById('total'),areaEl=document.getElementById('area'),materialCostEl=document.getElementById('materialCost'),cutCostEl=document.getElementById('cutCost'),installCostEl=document.getElementById('installCost'),partnerValueEl=document.getElementById('partnerValue');function calc(){const p=all.find(x=>x.id===Number(productEl.value))||all[0],base=num(p.price),a=Math.max(0,Number(lenEl.value)*Number(depthEl.value)+Number(backsplashEl.value||0)),mc=a*base,cc=Number(cutsEl.value||0)*250,ic=Number(installEl.value)?850:0,disc=(mc+cc+ic)*Number(partnerEl.value||0),tot=mc+cc+ic-disc;offerTitleEl.textContent=projectEl.value||clientEl.value||'Proiect nou';prodNameEl.textContent=`${p.title} · ${p.brand} · ${p.material}`;areaEl.textContent=a.toFixed(2)+' mp';materialCostEl.textContent=money(mc);cutCostEl.textContent=money(cc);installCostEl.textContent=money(ic);partnerValueEl.textContent='-'+money(disc);totalEl.textContent=money(tot);return{p,a,mc,cc,ic,disc,tot}}[projectEl,clientEl,productEl,lenEl,depthEl,backsplashEl,cutsEl,installEl,partnerEl].forEach(e=>e.oninput=calc);calc();document.getElementById('analyzeBtn').onclick=()=>{const f=fileEl.files[0];analysisEl.innerHTML=f?`✦ <b>${f.name}</b> încărcat local. Demo AI: am identificat un blat principal, o zonă de backsplash și ${cutsEl.value} decupaje. Verifică manual cotele înainte de ofertare.`:'Alege mai întâi o schiță, o randare sau un PDF.';toast('Analiza demo a fost actualizată')};document.getElementById('saveBtn').onclick=()=>{const c=calc(),arr=read(K.quotes);arr.unshift({id:'Q-'+Date.now().toString().slice(-6),project:projectEl.value||clientEl.value||'Proiect nou',product:c.p.title,total:Math.round(c.tot),date:new Date().toLocaleDateString('ro-RO')});write(K.quotes,arr);toast('Oferta a fost salvată în demo')};document.getElementById('waBtn').onclick=()=>{const c=calc();toast(`Mesaj: oferta pentru ${c.p.title} este estimată la ${money(c.tot)}.`)};document.getElementById('printBtn').onclick=()=>window.print()})();
</script></body></html>
