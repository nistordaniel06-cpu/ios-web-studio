<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBlat V3 Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="side"><a class="logo" href="app.html">eBlat <b>ADMIN</b></a><div class="over">V3 · Operations</div><nav class="nav"><a href="app.html"><i>←</i> Portal B2B</a><a href="../"><i>⌂</i> Site eBlat</a></nav><div class="side-bottom"><button class="btn red" id="logout">Ieșire</button></div></aside><main class="main"><header class="top"><div><b>eBlat Operations</b></div></header><div class="content" id="page"><div class="empty">Verific accesul Admin…</div></div></main></div><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="core.js"></script><script>
logout.onclick=signOut;
(async()=>{const u=await requireUser();if(!(await isAdmin())){page.innerHTML='<div class="page-head"><div><div class="eyebrow">Acces restricționat</div><h1>Admin eBlat.</h1><p>Contul tău nu este încă autorizat ca administrator.</p></div></div><div class="notice">După ce creezi contul V3, administratorul principal trebuie adăugat o singură dată în lista eBlat Admins.</div><a class="btn dark" href="app.html">Înapoi la portal</a>';return}await renderAdmin()})();
async function renderAdmin(){const [{data:profiles},{data:partners},{data:projects},{data:quotes},{data:ledger}]=await Promise.all([sb.from('eblat_profiles').select('*').order('created_at',{ascending:false}),sb.from('eblat_partners').select('*').order('created_at',{ascending:false}),sb.from('eblat_projects').select('*').order('created_at',{ascending:false}),sb.from('eblat_quotes').select('*').order('created_at',{ascending:false}),sb.from('eblat_wallet_ledger').select('*').order('created_at',{ascending:false})]);const pm=new Map((profiles||[]).map(x=>[x.user_id,x]));const total=(projects||[]).reduce((a,x)=>a+Number(x.estimated_value||0),0),pending=(ledger||[]).filter(x=>x.kind==='pending').reduce((a,x)=>a+Number(x.amount),0),earned=(ledger||[]).filter(x=>x.kind==='earned').reduce((a,x)=>a+Number(x.amount),0);page.innerHTML=`<div class="page-head"><div><div class="eyebrow">Control center</div><h1>eBlat Admin.</h1><p>Parteneri, proiecte, oferte și comisioane reale.</p></div><button class="btn" id="syncCat">Sincronizează catalogul</button></div><div class="stats"><div class="stat"><div class="ico">◎</div><div><b>${partners?.length||0}</b><span>parteneri</span></div></div><div class="stat"><div class="ico">▧</div><div><b>${projects?.length||0}</b><span>proiecte</span></div></div><div class="stat"><div class="ico">▣</div><div><b>${quotes?.length||0}</b><span>oferte</span></div></div><div class="stat"><div class="ico">◈</div><div><b>${money(total)}</b><span>valoare proiecte</span></div></div></div><div class="wallet-cards"><div class="wallet-card"><small>Comisioane pending</small><b>${money(pending)}</b></div><div class="wallet-card"><small>Comisioane earned</small><b>${money(earned)}</b></div><div class="wallet-card"><small>Catalog</small><b>286 produse</b></div></div>
<div class="section-head"><div><h2>Parteneri</h2><p>Aprobă și configurează nivelul comercial.</p></div></div>${partners?.length?`<table class="table"><thead><tr><th>Partener</th><th>Status</th><th>Tier</th><th>Comision</th><th>Acțiuni</th></tr></thead><tbody>${partners.map(p=>{const x=pm.get(p.user_id)||{};return`<tr><td><b>${esc(x.full_name||x.company_name||p.user_id.slice(0,8))}</b><br><span class="muted small">${esc(x.company_name||'')}</span></td><td><span class="tag ${statusClass(p.status)}">${esc(p.status)}</span></td><td>${esc(p.tier)}</td><td>${Math.round(Number(p.commission_rate)*100)}%</td><td><button class="btn sm partner-edit" data-user="${p.user_id}" data-status="${p.status}" data-tier="${p.tier}" data-rate="${p.commission_rate}">Editează</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Niciun partener.</div>'}
<div class="section-head"><div><h2>Proiecte</h2><p>Doar Admin-ul poate schimba statusurile operaționale.</p></div></div>${projects?.length?`<table class="table"><thead><tr><th>Proiect</th><th>Status</th><th>Valoare</th><th>Acțiune</th></tr></thead><tbody>${projects.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.city||'')}</span></td><td><span class="tag ${statusClass(p.status)}">${statusLabel(p.status)}</span></td><td>${money(p.estimated_value)}</td><td><select class="project-status" data-id="${p.id}">${STAGES.map(s=>`<option value="${s}" ${s===p.status?'selected':''}>${statusLabel(s)}</option>`).join('')}<option value="anulat" ${p.status==='anulat'?'selected':''}>Anulat</option></select> <button class="btn sm project-save" data-id="${p.id}">Salvează</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Niciun proiect.</div>'}
<div class="section-head"><div><h2>Oferte</h2><p>Aprobarea creează automat comisionul pending.</p></div></div>${quotes?.length?`<table class="table"><thead><tr><th>Ofertă</th><th>Status</th><th>Total</th><th>Comision</th><th>Acțiune</th></tr></thead><tbody>${quotes.map(q=>`<tr><td><b>${esc(q.quote_number)}</b></td><td><span class="tag ${statusClass(q.status)}">${esc(q.status)}</span></td><td>${money(q.total)}</td><td>${money(q.partner_commission)}</td><td><button class="btn sm quote-status" data-id="${q.id}" data-status="approved">Aprobă</button> <button class="btn sm red quote-status" data-id="${q.id}" data-status="rejected">Respinge</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nicio ofertă.</div>'}
<div class="section-head"><div><h2>Wallet ledger</h2><p>Plata se poate marca doar după ce comisionul este earned.</p></div></div>${ledger?.length?`<table class="table"><thead><tr><th>Tip</th><th>Descriere</th><th>Sumă</th><th>Acțiune</th></tr></thead><tbody>${ledger.map(l=>`<tr><td><span class="tag ${statusClass(l.kind)}">${esc(l.kind)}</span></td><td>${esc(l.description||'')}</td><td>${money(l.amount)}</td><td>${l.kind==='earned'?`<button class="btn sm pay" data-id="${l.id}">Marchează plătit</button>`:'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ledger gol.</div>'}`;
bindAdmin()}
function bindAdmin(){document.querySelectorAll('.partner-edit').forEach(b=>b.onclick=()=>editPartner(b));document.querySelectorAll('.project-save').forEach(b=>b.onclick=async()=>{const sel=document.querySelector(`.project-status[data-id="${b.dataset.id}"]`);const {error}=await sb.rpc('eblat_admin_set_project_status',{p_project_id:b.dataset.id,p_status:sel.value,p_note:'Actualizat din eBlat Admin V3'});if(error)return toast(error.message);toast('Status actualizat');renderAdmin()});document.querySelectorAll('.quote-status').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('eblat_admin_set_quote_status',{p_quote_id:b.dataset.id,p_status:b.dataset.status});if(error)return toast(error.message);toast('Oferta actualizată');renderAdmin()});document.querySelectorAll('.pay').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('eblat_admin_mark_wallet_paid',{p_ledger_id:b.dataset.id});if(error)return toast(error.message);toast('Comision marcat plătit');renderAdmin()});syncCat.onclick=syncCatalog}
function editPartner(b){const o=openModal(`<div class="modal-head"><h2>Condiții partener</h2><button class="close">×</button></div><form id="partnerForm" class="form"><div class="field"><label>Status</label><select name="status"><option ${b.dataset.status==='pending'?'selected':''}>pending</option><option ${b.dataset.status==='active'?'selected':''}>active</option><option ${b.dataset.status==='suspended'?'selected':''}>suspended</option></select></div><div class="field"><label>Tier</label><select name="tier"><option ${b.dataset.tier==='partner'?'selected':''}>partner</option><option ${b.dataset.tier==='pro'?'selected':''}>pro</option><option ${b.dataset.tier==='elite'?'selected':''}>elite</option><option ${b.dataset.tier==='strategic'?'selected':''}>strategic</option></select></div><div class="field full"><label>Comision</label><select name="rate"><option value="0.04">4%</option><option value="0.05" selected>5%</option><option value="0.06">6%</option><option value="0.07">7%</option></select></div><div class="field full"><button class="btn dark">Salvează</button></div></form>`);o.querySelector('.close').onclick=closeModal;o.querySelector('#partnerForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.rpc('eblat_admin_set_partner',{p_user_id:b.dataset.user,p_status:f.get('status'),p_tier:f.get('tier'),p_rate:Number(f.get('rate'))});if(error)return toast(error.message);closeModal();toast('Partener actualizat');renderAdmin()}}
async function syncCatalog(){const {data,error}=await sb.functions.invoke('eblat-catalog-sync',{body:{}});if(error)return toast(error.message);toast(`Catalog sincronizat: ${data?.synced||0} produse`)}
</script></body></html>
