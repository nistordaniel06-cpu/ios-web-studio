<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBlat — Selecție materiale</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="share-page"><header class="share-nav"><div class="share-wrap"><div class="share-brand">eBlat.ro</div></div></header><main class="share-wrap" id="share"><section class="share-hero"><div class="eyebrow">Selecție privată de materiale</div><h1>Se încarcă…</h1></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="core.js"></script><script>
(async()=>{const token=qs('token');if(!token){share.innerHTML='<div class="empty" style="margin-top:50px">Link invalid.</div>';return}const {data:m,error}=await sb.from('eblat_moodboards').select('*').eq('share_token',token).eq('is_public',true).maybeSingle();if(error||!m){share.innerHTML='<div class="empty" style="margin-top:50px">Moodboard-ul nu este public sau linkul nu mai este valabil.</div>';return}const {data:items}=await sb.from('eblat_moodboard_items').select('*').eq('moodboard_id',m.id).order('sort_order');document.title=m.title+' — eBlat';share.innerHTML=`<section class="share-hero"><div class="eyebrow">eBlat · selecție materiale</div><h1>${esc(m.title)}</h1><p class="muted">${esc(m.client_name||'Selecție pregătită pentru proiectul tău.')}</p></section><section class="share-grid">${(items||[]).map(i=>`<article class="share-item"><img src="${esc(i.image_url||'')}" alt="${esc(i.title)}"><div class="body"><h3 style="margin:0">${esc(i.title)}</h3><p class="muted small">Material selectat prin eBlat PRO.</p></div></article>`).join('')||'<div class="empty">Nu sunt materiale publicate încă.</div>'}</section>`})();
</script></body></html>
