<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBlat V3.3 Admin — Leads & Portofoliu</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="admin-shell"><aside class="side"><a class="logo" href="./">eBlat ADMIN</a><nav><button class="active" data-view="leads">◎ Leads</button><button data-view="portfolio">▧ Portofoliu</button><a href="../v3/admin.html">◈ Operations V3</a><a href="./">⌂ Site V3.3</a></nav><div style="margin-top:auto;padding-top:30px"><button class="btn red" id="logout">Ieșire</button></div></aside><main class="main"><header class="top"><b>eBlat Commercial Admin · V3.3</b></header><div class="content" id="page"><div class="empty">Verific accesul…</div></div></main></div><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="common.js"></script><script>const stages=['nou','contactat','calificat','ofertat','castigat','pierdut'];const labels={nou:'Nou',contactat:'Contactat',calificat:'Calificat',ofertat:'Ofertat',castigat:'Câștigat',pierdut:'Pierdut'};let view='leads';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});logout.onclick=async()=>{await sb.auth.signOut();location.href='../v3/'};(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){page.innerHTML='<div class="empty">Trebuie să fii autentificat. <a class="btn dark" href="../v3/">Login eBlat PRO</a></div>';return}if(!(await isAdmin())){page.innerHTML='<div class="empty">Contul autentificat nu are acces Admin.</div>';return}render()})();async function render(){if(view==='portfolio')return renderPortfolio();return renderLeads()}async function renderLeads(){page.innerHTML='<div class="empty">Încarc leadurile…</div>';const {data:leads,error}=await sb.from('eblat_public_leads').select('*').order('created_at',{ascending:false});if(error){page.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const value=(leads||[]).reduce((a,x)=>a+Number(x.budget_estimate||0),0);page.innerHTML=`<div class="section-head"><div><div class="eyebrow">Sales pipeline</div><h1>Leaduri eBlat.</h1><p>De la cerere nouă până la proiect câștigat. Leadurile din homepage și calculator intră automat aici.</p></div><button class="btn dark" id="refresh">Reîncarcă</button></div><div class="stats"><div class="stat"><b>${leads?.length||0}</b><span>leaduri totale</span></div><div class="stat"><b>${leads?.filter(x=>x.status==='nou').length||0}</b><span>noi</span></div><div class="stat"><b>${leads?.filter(x=>x.status==='ofertat').length||0}</b><span>ofertate</span></div><div class="stat"><b>${money(value)}</b><span>valoare estimată pipeline</span></div></div><div class="kanban">${stages.map(s=>`<section class="lane"><h3>${labels[s]} · ${(leads||[]).filter(x=>(x.status||'nou')===s).length}</h3>${(leads||[]).filter(x=>(x.status||'nou')===s).map(l=>leadCard(l)).join('')||'<div class="small muted">Gol</div>'}</section>`).join('')}</div>`;refresh.onclick=renderLeads;document.querySelectorAll('.lead-edit').forEach(b=>b.onclick=()=>editLead((leads||[]).find(x=>x.id===b.dataset.id)))}function leadCard(l){return `<article class="lead"><b>${esc(l.name||'Lead')}</b><p>${esc(l.contact||'')}</p>${l.material?`<p>${esc(l.material)}</p>`:''}${l.budget_estimate?`<span class="tag green">${money(l.budget_estimate)}</span>`:''}<p>${new Date(l.created_at).toLocaleDateString('ro-RO')}</p><button class="btn sm lead-edit" data-id="${l.id}">Deschide</button></article>`}function editLead(l){page.innerHTML=`<div class="section-head"><div><div class="eyebrow">Lead</div><h1>${esc(l.name||'Lead')}</h1><p>${esc(l.contact||'')}</p></div><button class="btn" id="back">← Pipeline</button></div><div class="calc-grid"><section class="panel"><div class="form"><div class="field"><label>Status</label><select id="status">${stages.map(s=>`<option value="${s}" ${s===(l.status||'nou')?'selected':''}>${labels[s]}</option>`).join('')}</select></div><div class="field"><label>Follow-up</label><input id="follow" type="date" value="${l.next_followup||''}"></div><div class="field"><label>Buget estimat</label><input id="budget" type="number" value="${Number(l.budget_estimate||0)}"></div><div class="field"><label>Sursă</label><input disabled value="${esc(l.source||'—')}"></div><div class="field full"><label>Notițe interne</label><textarea id="notes">${esc(l.admin_notes||'')}</textarea></div><div class="field full"><button class="btn dark" id="save">Salvează lead</button></div></div></section><aside class="panel"><h3>Detalii cerere</h3><p class="small muted"><b>Tip:</b> ${esc(l.project_type||'—')}</p><p class="small muted"><b>Material:</b> ${esc(l.material||'—')}</p><p class="small muted"><b>Telefon:</b> ${esc(l.phone||'—')}</p><p class="small muted"><b>Email:</b> ${esc(l.email||'—')}</p><div class="notice">${esc(l.details||'Fără detalii suplimentare.')}</div></aside></div>`;back.onclick=renderLeads;save.onclick=async()=>{const {error}=await sb.from('eblat_public_leads').update({status:status.value,next_followup:follow.value||null,budget_estimate:Number(budget.value||0),admin_notes:notes.value.trim(),updated_at:new Date().toISOString()}).eq('id',l.id);if(error)return toast(error.message);toast('Lead actualizat');renderLeads()}}async function renderPortfolio(){page.innerHTML='<div class="empty">Încarc portofoliul…</div>';const {data:items,error}=await sb.from('eblat_portfolio_projects').select('*').order('created_at',{ascending:false});if(error){page.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}page.innerHTML=`<div class="section-head"><div><div class="eyebrow">CMS proiecte reale</div><h1>Portofoliu eBlat.</h1><p>Doar proiectele marcate <b>published</b> apar pe site.</p></div></div><div class="calc-grid"><form class="panel form" id="projectForm"><div class="field full"><label>Titlu proiect</label><input id="title" required placeholder="Bucătărie Corbeanca"></div><div class="field"><label>Oraș</label><input id="city" placeholder="Corbeanca, Ilfov"></div><div class="field"><label>Tip proiect</label><select id="type"><option>Bucătărie rezidențială</option><option>Baie</option><option>Comercial</option><option>Hotel / HoReCa</option><option>Showroom</option></select></div><div class="field"><label>Material</label><input id="mat" placeholder="Nero Marquina / Quartz"></div><div class="field"><label>Data finalizării</label><input id="completed" type="date"></div><div class="field full"><label>Descriere</label><textarea id="desc" placeholder="Detalii reale despre lucrare…"></textarea></div><div class="field full uploadbox"><label>Fotografii reale (JPG/PNG/WebP)</label><input id="files" type="file" accept="image/*" multiple required><div class="small muted">Prima fotografie devine copertă.</div></div><div class="field"><label>Status inițial</label><select id="pub"><option value="draft">Draft</option><option value="published">Published</option></select></div><div class="field"><label>Featured</label><select id="feat"><option value="0">Nu</option><option value="1">Da</option></select></div><div class="field full"><button class="btn dark" type="submit">Încarcă proiectul →</button></div></form><section class="panel"><h3>Proiecte existente</h3><div id="portfolioList">${items?.length?items.map(p=>`<article class="lead"><b>${esc(p.title)}</b><p>${esc(p.city||'')} · ${esc(p.material_label||'')}</p><span class="tag ${p.status==='published'?'green':'orange'}">${p.status}</span> ${p.featured?'<span class="tag blue">featured</span>':''}<div style="margin-top:8px"><button class="btn sm togglePub" data-id="${p.id}" data-status="${p.status}">${p.status==='published'?'Mută în draft':'Publică'}</button></div></article>`).join(''):'<div class="empty">Niciun proiect încă.</div>'}</div></section></div>`;projectForm.onsubmit=async e=>{e.preventDefault();const list=[...files.files];if(!list.length)return toast('Alege fotografiile proiectului.');const slug=(title.value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString().slice(-5));const urls=[];try{for(const [i,f] of list.entries()){const clean=f.name.replace(/[^a-zA-Z0-9._-]+/g,'-');const path=`${slug}/${Date.now()}-${i}-${clean}`;const {error:upErr}=await sb.storage.from('eblat-portfolio').upload(path,f,{upsert:false});if(upErr)throw upErr;const {data:u}=sb.storage.from('eblat-portfolio').getPublicUrl(path);urls.push(u.publicUrl)}const {data:proj,error:pe}=await sb.from('eblat_portfolio_projects').insert({slug,title:title.value.trim(),city:city.value.trim(),project_type:type.value,material_label:mat.value.trim(),description:desc.value.trim(),cover_url:urls[0],status:pub.value,featured:feat.value==='1',completed_at:completed.value||null}).select().single();if(pe)throw pe;if(urls.length)await sb.from('eblat_portfolio_images').insert(urls.map((url,i)=>({project_id:proj.id,url,sort_order:i})));toast('Proiect încărcat');renderPortfolio()}catch(err){toast(err.message)}};document.querySelectorAll('.togglePub').forEach(b=>b.onclick=async()=>{const next=b.dataset.status==='published'?'draft':'published';const {error}=await sb.from('eblat_portfolio_projects').update({status:next,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);if(error)return toast(error.message);toast(next==='published'?'Proiect publicat':'Proiect mutat în draft');renderPortfolio()})}</script></body></html>
