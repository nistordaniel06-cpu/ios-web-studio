<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material eBlat</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="./">eBlat.ro<small>detaliu material</small></a><nav class="links"><a href="./#materiale">Materiale</a><a href="proiecte.html">Proiecte</a><a href="calculator.html">Calculator</a><a href="../v3/">eBlat PRO</a></nav><div class="nav-actions"><a class="btn sand" href="calculator.html">Calculează →</a><button class="hamb" id="hamb">☰</button></div></div></header><div class="mobile" id="mobile"><a href="./#materiale">Materiale</a><a href="proiecte.html">Proiecte</a><a href="calculator.html">Calculator</a><a href="../v3/">eBlat PRO</a></div><main class="section"><div class="wrap"><div id="page"><div class="empty">Se încarcă materialul…</div></div></div></main><footer class="footer"><div class="wrap"><div class="copy">eBlat.ro · produs premium</div></div></footer><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="common.js"></script><script>nav();(async()=>{try{const id=Number(qs('id'));const {data:p,error}=await sb.from('eblat_products').select('*').eq('product_id',id).single();if(error||!p)throw error||new Error('Produs indisponibil');document.title=p.title+' — eBlat.ro';const all=await products();const similar=all.filter(x=>x.product_id!==p.product_id&&x.material===p.material).sort((a,b)=>Math.abs(Number(a.price||0)-Number(p.price||0))-Math.abs(Number(b.price||0)-Number(p.price||0))).slice(0,4);page.innerHTML=`<div class="section-head"><div><div class="eyebrow">${esc(p.brand||'eBlat')}</div><h1>${esc(p.title)}</h1><p>${esc(p.material||'Material premium')}</p></div><a class="btn" href="./#materiale">← Înapoi la materiale</a></div><section class="detail"><div><div class="detail-image"><img src="${img(p)}" alt="${esc(p.title)}"></div><div class="kitchen-preview"></div></div><article class="detail-info"><span class="tag">${esc(p.material||'Material premium')}</span><h1>${esc(p.title)}</h1><div class="muted">${esc(p.brand||'')}</div><div class="detail-price">${p.price?money(p.price)+'/mp':'Preț la cerere'}</div><div class="specs"><div class="spec"><small>Brand</small><b>${esc(p.brand||'—')}</b></div><div class="spec"><small>Material</small><b>${esc(p.material||'—')}</b></div><div class="spec"><small>Preț catalog</small><b>${p.price?money(p.price)+'/mp':'La cerere'}</b></div><div class="spec"><small>Cod eBlat</small><b>#${p.product_id}</b></div></div><div class="notice">Prețul afișat este orientativ din catalogul sincronizat. Prețul final depinde de cote, grosime, canturi, decupaje, transport, montaj și disponibilitate.</div><div class="detail-actions" style="margin-top:16px"><a class="btn dark" href="calculator.html?id=${p.product_id}">Calculează proiectul →</a><button class="btn sand" id="sample">Solicită ofertă</button>${p.product_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(p.product_url)}">Sursa produsului</a>`:''}</div></article></section><section class="section" style="padding-bottom:0"><div class="section-head"><div><div class="eyebrow">Alternative similare</div><h2>Compară înainte să alegi.</h2></div></div><div class="product-grid">${similar.map(x=>`<article class="product"><div class="media"><img src="${img(x)}" alt="${esc(x.title)}"></div><div class="body"><small>${esc(x.brand||'')}</small><h3>${esc(x.title)}</h3><div class="price">${x.price?money(x.price)+'/mp':'La cerere'}</div><div class="product-actions"><a href="produs.html?id=${x.product_id}">Detalii</a><a class="dark" href="calculator.html?id=${x.product_id}">Calculează</a></div></div></article>`).join('')}</div></section>`;sample.onclick=async()=>{try{await submitLead({name:'Interes produs',contact:'de completat',project_type:'Cerere material',material:p.title,details:'Lead inițiat din pagina de produs #'+p.product_id,source:'v33_product',status:'nou',product_id:p.product_id});toast('Am salvat interesul. Pentru ofertă exactă folosește calculatorul.')}catch(e){toast('Nu am putut salva cererea.')}}}catch(e){page.innerHTML='<div class="empty">Materialul nu a putut fi încărcat.</div>'}})();</script></body></html>
