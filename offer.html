<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ofertă PureStone</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>:root{--bg:#f4efe7;--paper:#fff;--ink:#201d19;--muted:#7b7369;--line:rgba(32,29,25,.12);--gold:#a48058;--dark:#211e1a;--green:#2f7d57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:DM Sans,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:32px auto}.sheet{background:var(--paper);border-radius:28px;padding:42px;box-shadow:0 24px 70px rgba(52,42,31,.12)}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:24px}.brand{font-family:Playfair Display,serif;letter-spacing:.18em;font-size:20px}.meta{text-align:right;font-size:10px;color:var(--muted)}h1{font-family:Playfair Display,serif;font-size:52px;line-height:.95;margin:38px 0 12px}.customer{color:var(--muted);line-height:1.65}.items{width:100%;border-collapse:collapse;margin:32px 0}.items th,.items td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}.items th{font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.items td:last-child,.items th:last-child{text-align:right}.summary{margin-left:auto;width:min(360px,100%)}.sum{display:flex;justify-content:space-between;padding:8px 0;font-size:11px}.sum.total{font-family:Playfair Display,serif;font-size:24px;border-top:1px solid var(--line);margin-top:7px;padding-top:14px}.notes{margin-top:30px;padding:18px;border-radius:17px;background:#f6f0e8;font-size:11px;line-height:1.6;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:700;cursor:pointer}.dark{background:var(--dark);color:#fff}.light{background:#fff;border:1px solid var(--line)}.green{background:var(--green);color:#fff}.accept{margin-top:16px;display:none}.accept.show{display:block}.accept textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:13px;padding:11px}.status{font-size:10px;color:var(--muted);margin-top:8px}.ok{color:var(--green);font-weight:700}@media(max-width:650px){.wrap{width:calc(100% - 14px);margin:7px auto}.sheet{padding:24px 17px;border-radius:20px}.top{display:block}.meta{text-align:left;margin-top:10px}h1{font-size:42px}.items th:nth-child(3),.items td:nth-child(3){display:none}}@media print{body{background:#fff}.wrap{width:100%;margin:0}.sheet{box-shadow:none;border-radius:0;padding:15mm}.actions,.accept{display:none!important}}</style></head><body><main class="wrap"><article class="sheet" id="sheet"><div class="top"><div><div class="brand">PURESTONE</div><div style="font-size:9px;color:var(--muted);letter-spacing:.13em;margin-top:4px">NATURAL ELEGANCE • ROMÂNIA</div></div><div class="meta" id="meta">Se încarcă oferta...</div></div><h1>Ofertă personalizată.</h1><div class="customer" id="customer"></div><table class="items"><thead><tr><th>Descriere</th><th>Cant.</th><th>UM</th><th>Preț unitar</th><th>Total</th></tr></thead><tbody id="items"></tbody></table><div class="summary"><div class="sum"><span>Subtotal</span><b id="subtotal"></b></div><div class="sum"><span>TVA</span><b id="vat"></b></div><div class="sum total"><span>Total</span><b id="total"></b></div></div><div class="notes" id="notes"></div><div class="actions"><button class="btn light" onclick="window.print()">Salvează / Print PDF</button><button class="btn green" id="acceptBtn">Accept oferta</button><a class="btn dark" href="./booking.html?type=measurement" style="text-decoration:none">Programează măsurători</a></div><div class="accept" id="accept"><textarea id="clientNote" placeholder="Mesaj opțional pentru echipa PureStone..."></textarea><button class="btn green" id="confirmAccept" style="margin-top:8px">Confirm acceptarea</button><div class="status" id="status"></div></div></article></main><script>const $=s=>document.querySelector(s),p=new URLSearchParams(location.search),id=p.get('id'),token=p.get('token'),API='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-offer-public';const money=n=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:'RON',maximumFractionDigits:2}).format(Number(n||0));let offer=null;async function load(){try{const r=await fetch(`${API}?id=${encodeURIComponent(id||'')}&token=${encodeURIComponent(token||'')}`),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Oferta nu poate fi deschisă.');offer=j.offer;document.title=`Oferta PS-${new Date(offer.created_at).getFullYear()}-${String(offer.offer_no).padStart(4,'0')} • PureStone`;$('#meta').innerHTML=`OFERTA PS-${new Date(offer.created_at).getFullYear()}-${String(offer.offer_no).padStart(4,'0')}<br>${new Date(offer.created_at).toLocaleDateString('ro-RO')}<br>${offer.valid_until?'Valabilă până la '+new Date(offer.valid_until+'T12:00:00').toLocaleDateString('ro-RO'):''}`;$('#customer').innerHTML=`Pregătită pentru <b>${offer.customer_name}</b>.<br>Status: <b>${offer.status}</b>`;$('#items').innerHTML=(offer.items||[]).map(x=>`<tr><td>${x.description}</td><td>${x.qty}</td><td>${x.unit||'buc'}</td><td>${money(x.unit_price)}</td><td><b>${money(x.total)}</b></td></tr>`).join('');$('#subtotal').textContent=money(offer.subtotal);$('#vat').textContent=money(Number(offer.total)-Number(offer.subtotal))+' ('+offer.vat_percent+'%)';$('#total').textContent=money(offer.total);$('#notes').textContent=offer.notes||'Prețurile sunt valabile conform condițiilor menționate în ofertă. Măsurătorile finale pot ajusta cantitățile și operațiunile.';$('#acceptBtn').style.display=['accepted','rejected','expired'].includes(offer.status)?'none':'inline-block';if(offer.status==='accepted'){$('#notes').insertAdjacentHTML('beforeend','<br><br><b style="color:var(--green)">Oferta a fost acceptată.</b>')}}catch(e){$('#meta').textContent=e.message}}$('#acceptBtn').onclick=()=>$('#accept').classList.toggle('show');$('#confirmAccept').onclick=async()=>{const st=$('#status');st.textContent='Se confirmă...';try{const r=await fetch(`${API}?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'accept',client_note:$('#clientNote').value})}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');st.className='status ok';st.textContent='Oferta a fost acceptată ✓';setTimeout(()=>location.reload(),700)}catch(e){st.textContent=e.message}};load();</script></body></html>
