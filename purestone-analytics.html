<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PureStone • Analytics</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><script src="./purestone-admin-session.js"></script><style>:root{--bg:#f4efe7;--ink:#201d19;--muted:#7b7369;--line:rgba(32,29,25,.12);--gold:#a48058;--dark:#211e1a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:DM Sans,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.serif{font-family:Playfair Display,serif}.top{position:sticky;top:0;background:rgba(244,239,231,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.topin{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Playfair Display,serif;letter-spacing:.15em}.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none}.dark{background:var(--dark);color:white}.light{background:white;border:1px solid var(--line);color:var(--ink)}.hero{padding:34px 0 18px}.hero h1{font-size:clamp(44px,7vw,70px);line-height:.95;margin:6px 0 12px}.gate{max-width:520px;background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:22px;padding:18px}.dash{display:none;padding:18px 0 70px}.dash.show{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:20px;padding:16px}.card b{font-family:Playfair Display,serif;font-size:34px;display:block}.card span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel h2{font-family:Playfair Display,serif;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}.row:last-child{border-bottom:0}.row span{color:var(--muted)}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.topin{padding:10px 0;gap:10px}.topin .light{display:none}}</style></head><body><header class="top"><div class="wrap topin"><div class="brand">PURESTONE <span style="font-family:DM Sans;font-size:9px;color:var(--muted)">ANALYTICS</span></div><div><a class="btn light" href="./purestone-dashboard-v4.html">Dashboard</a> <a class="btn dark" href="./purestone.html">Site</a></div></div></header><main class="wrap"><section class="hero"><div style="font-size:10px;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-weight:700">Ultimele 30 zile</div><h1 class="serif">Ce fac vizitatorii.</h1><p style="color:var(--muted)">Analytics first-party, activ doar pentru vizitatorii care acceptă măsurarea.</p></section><section class="gate" id="gate">Autentificare Admin necesară. <a href="./purestone-dashboard-v4.html">Mergi la Dashboard</a></section><section class="dash" id="dash"><div class="cards" id="cards"></div><div class="grid"><div class="panel"><h2>Top materiale</h2><div id="products"></div></div><div class="panel"><h2>Evenimente recente</h2><div id="events"></div></div></div></section></main><script>const $=s=>document.querySelector(s),API='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-event';const labels={page_view:'Vizualizări',view_product:'Produse văzute',favorite:'Favorite',unfavorite:'Favorite șterse',submit_quote:'Cereri trimise',open_whatsapp:'WhatsApp',open_simulator:'Simulator homepage',start_quote:'Porniri ofertă',catalog_search:'Căutări',catalog_filter:'Filtre catalog',open_kitchen_visualizer:'Deschideri Kitchen Visualizer',open_compare:'Deschideri comparație',compare_open:'Comparații',kitchen_upload:'Poze încărcate',kitchen_material:'Materiale testate',kitchen_surface_marked:'Suprafețe marcate',kitchen_download:'Vizualizări salvate',appointment_submit:'Programări trimise'};async function load(){if(!await PureStoneAdminSession.verify().catch(()=>false))return;$('#gate').style.display='none';try{const r=await fetch(API,{headers:await PureStoneAdminSession.headers()}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');$('#dash').classList.add('show');const c=j.counts||{},keys=['page_view','view_product','favorite','submit_quote','open_whatsapp','open_simulator','open_kitchen_visualizer','open_compare','kitchen_upload','kitchen_surface_marked','kitchen_download','appointment_submit'];$('#cards').innerHTML=keys.map(k=>`<div class="card"><b>${c[k]||0}</b><span>${labels[k]||k}</span></div>`).join('');$('#products').innerHTML=(j.top_products||[]).length?j.top_products.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join(''):'<div style="color:var(--muted);font-size:11px">Încă nu sunt date suficiente.</div>';$('#events').innerHTML=(j.events||[]).slice(0,35).map(e=>`<div class="row"><span>${labels[e.event_name]||e.event_name}${e.product_slug?' • '+e.product_slug:''}</span><b>${new Date(e.created_at).toLocaleDateString('ro-RO')}</b></div>`).join('')}catch(e){$('#gate').textContent=e.message}}load();</script></body></html>
