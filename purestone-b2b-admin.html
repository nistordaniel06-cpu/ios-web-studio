<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PureStone • B2B Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><script src="./purestone-admin-session.js"></script><style>:root{--bg:#f4efe7;--paper:#fbf8f3;--ink:#201d19;--muted:#7b7369;--line:rgba(32,29,25,.12);--gold:#a48058;--dark:#211e1a;--green:#2f7d57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:DM Sans,sans-serif}.wrap{width:min(1200px,calc(100% - 28px));margin:auto}.serif{font-family:Playfair Display,serif}.top{position:sticky;top:0;z-index:20;background:rgba(244,239,231,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Playfair Display,serif;letter-spacing:.15em}.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.dark{background:var(--dark);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.hero{padding:32px 0 15px}.hero h1{font-size:clamp(44px,7vw,68px);line-height:.95;margin:6px 0 10px}.tabs{display:flex;gap:6px;overflow:auto;padding:8px 0 14px}.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:9px;font-weight:700}.tabs button.active{background:var(--dark);color:#fff}.panel{display:none}.panel.active{display:block}.list{display:grid;gap:9px;padding-bottom:70px}.card{background:rgba(255,255,255,.54);border:1px solid var(--line);border-radius:20px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.card h3{font-family:Playfair Display,serif;font-size:22px;margin:0 0 5px}.meta{font-size:9px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-size:9px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}.stat{background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{font-family:Playfair Display,serif;font-size:28px;display:block}.stat span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.card{grid-template-columns:1fr}.actions{justify-content:flex-start}.nav .light{display:none}}</style></head><body><header class="top"><div class="wrap nav"><div class="brand">PURESTONE <span style="font-family:DM Sans;font-size:9px;color:var(--muted)">B2B ADMIN</span></div><div><a class="btn light" href="./purestone-dashboard.html">Dashboard</a> <a class="btn dark" href="./b2b.html" target="_blank">Portal B2B</a></div></div></header><main class="wrap"><section class="hero"><div style="font-size:9px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;font-weight:700">Profesioniști & programări</div><h1 class="serif">B2B control center.</h1></section><div class="stats"><div class="stat"><b id="nProfiles">0</b><span>Conturi B2B</span></div><div class="stat"><b id="nProjects">0</b><span>Proiecte</span></div><div class="stat"><b id="nSamples">0</b><span>Mostre</span></div><div class="stat"><b id="nAppointments">0</b><span>Programări</span></div><div class="stat"><b id="nOffers">0</b><span>Oferte</span></div></div><nav class="tabs"><button class="active" data-tab="profiles">Conturi</button><button data-tab="projects">Proiecte</button><button data-tab="samples">Mostre</button><button data-tab="appointments">Programări</button><button data-tab="offers">Oferte</button></nav><section class="panel active" data-panel="profiles"><div class="list" id="profiles"></div></section><section class="panel" data-panel="projects"><div class="list" id="projects"></div></section><section class="panel" data-panel="samples"><div class="list" id="samples"></div></section><section class="panel" data-panel="appointments"><div class="list" id="appointments"></div></section><section class="panel" data-panel="offers"><div class="list" id="offers"></div></section></main><script>const $=s=>document.querySelector(s),API='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-v4-admin';let data=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function hdr(json=false){return {...(json?{'Content-Type':'application/json'}:{}),...(await PureStoneAdminSession.headers())}}async function call(body){const r=await fetch(API,{method:'POST',headers:await hdr(true),body:JSON.stringify(body)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');return j}async function load(){if(!await PureStoneAdminSession.verify().catch(()=>false)){location.href='./purestone-dashboard.html';return}const r=await fetch(API,{headers:await hdr()}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');data=j;render()}function render(){for(const [id,key] of [['nProfiles','profiles'],['nProjects','projects'],['nSamples','samples'],['nAppointments','appointments'],['nOffers','offers']])$('#'+id).textContent=data[key].length;$('#profiles').innerHTML=data.profiles.map(x=>`<article class="card"><div><h3>${esc(x.full_name||'Cont B2B')}</h3><div class="meta"><span>${esc(x.company_name||x.profession||'')}</span><span>${esc(x.phone||'')}</span><span>${esc(x.city||'')}</span><span>• ${esc(x.status)}</span></div></div><div class="actions"><select data-profile="${x.user_id}"><option value="pending" ${x.status==='pending'?'selected':''}>În verificare</option><option value="approved" ${x.status==='approved'?'selected':''}>Aprobat</option><option value="blocked" ${x.status==='blocked'?'selected':''}>Blocat</option></select></div></article>`).join('')||'<div>Fără conturi.</div>';document.querySelectorAll('[data-profile]').forEach(s=>s.onchange=async()=>{await call({action:'profile_status',user_id:s.dataset.profile,status:s.value});load()});$('#projects').innerHTML=data.projects.map(x=>`<article class="card"><div><h3>${esc(x.name)}</h3><div class="meta"><span>${esc(x.client_name||'')}</span><span>${esc(x.location||'')}</span><span>• ${esc(x.status)}</span></div></div><div class="actions"><a class="btn light" href="./purestone-offer-builder.html?project=${encodeURIComponent(x.id)}&user=${encodeURIComponent(x.user_id)}">Generează ofertă</a></div></article>`).join('')||'<div>Fără proiecte.</div>';$('#samples').innerHTML=data.samples.map(x=>`<article class="card"><div><h3>${esc(x.material_name)}</h3><div class="meta"><span>${esc(x.delivery_method)}</span><span>${esc(x.address||'')}</span><span>${new Date(x.created_at).toLocaleDateString('ro-RO')}</span></div></div><div class="actions"><select data-sample="${x.id}">${['requested','preparing','shipped','ready','delivered','cancelled'].map(v=>`<option value="${v}" ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div></article>`).join('')||'<div>Fără mostre.</div>';document.querySelectorAll('[data-sample]').forEach(s=>s.onchange=async()=>{await call({action:'sample_status',id:s.dataset.sample,status:s.value});load()});$('#appointments').innerHTML=data.appointments.map(x=>`<article class="card"><div><h3>${esc(x.name)} — ${x.appointment_type==='measurement'?'Măsurători':x.appointment_type==='showroom'?'Showroom':'Consultanță'}</h3><div class="meta"><span>${esc(x.phone)}</span><span>${new Date(x.preferred_date+'T12:00:00').toLocaleDateString('ro-RO')} ${esc(x.preferred_time||'')}</span><span>${esc(x.location||'')}</span></div></div><div class="actions"><a class="btn light" href="tel:${esc(x.phone)}">Sună</a><select data-appointment="${x.id}">${['requested','confirmed','completed','cancelled'].map(v=>`<option value="${v}" ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div></article>`).join('')||'<div>Fără programări.</div>';document.querySelectorAll('[data-appointment]').forEach(s=>s.onchange=async()=>{await call({action:'appointment_status',id:s.dataset.appointment,status:s.value});load()});$('#offers').innerHTML=data.offers.map(x=>`<article class="card"><div><h3>PS-${new Date(x.created_at).getFullYear()}-${String(x.offer_no).padStart(4,'0')} — ${esc(x.customer_name)}</h3><div class="meta"><span>${Number(x.total).toLocaleString('ro-RO')} RON</span><span>• ${esc(x.status)}</span></div></div><div class="actions"><a class="btn light" target="_blank" href="./offer.html?id=${encodeURIComponent(x.id)}&token=${encodeURIComponent(x.public_token)}">Vezi</a><a class="btn dark" href="./purestone-offer-builder.html?offer=${encodeURIComponent(x.id)}">Editează</a></div></article>`).join('')||'<div>Fără oferte.</div>'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.tab))});load().catch(e=>alert(e.message));</script></body></html>
