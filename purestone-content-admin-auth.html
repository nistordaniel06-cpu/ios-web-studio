<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PureStone • Content CMS</title><meta name="theme-color" content="#f4efe7"><script src="./purestone-admin-session.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#f4efe7;font-family:system-ui,sans-serif}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#211e1a;color:white;font-size:12px;box-sizing:border-box}.bar a,.bar button{border:0;border-radius:999px;padding:8px 12px;background:#fff;color:#211e1a;text-decoration:none;font-weight:700}.frame{width:100%;height:calc(100dvh - 52px);border:0;display:block}.gate{position:fixed;inset:52px 0 0;z-index:10;background:#f4efe7;display:grid;place-items:center;padding:22px}.gate-card{width:min(460px,100%);background:#fbf8f3;border:1px solid rgba(32,29,25,.12);border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(57,47,36,.12)}.gate-card h1{font-family:Georgia,serif;margin:0 0 8px}.gate-card p{font-size:12px;line-height:1.6;color:#756c62}.gate-card a{display:inline-flex;border-radius:999px;background:#211e1a;color:white;padding:10px 14px;text-decoration:none;font-weight:700}.hidden{display:none}</style></head><body><div class="bar"><strong>PURESTONE • CONTENT CMS</strong><div style="display:flex;gap:8px"><a href="./purestone-dashboard-v4.html">Dashboard</a><button id="logout">Logout</button></div></div><div class="gate" id="gate"><div class="gate-card"><h1>Autentificare necesară</h1><p>Deschide Dashboard-ul PureStone și autentifică-te cu contul de administrator.</p><a href="./purestone-dashboard-v4.html">Mergi la Dashboard</a></div></div><iframe class="frame" id="frame" src="about:blank" title="PureStone Content CMS"></iframe><script>const frame=document.getElementById('frame'),gate=document.getElementById('gate');async function boot(){const ok=await PureStoneAdminSession.verify().catch(()=>false);if(!ok)return;gate.classList.add('hidden');frame.src='./purestone-admin.html';frame.addEventListener('load',async()=>{try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;const originalFetch=w.fetch.bind(w);w.fetch=async(input,init={})=>{const url=typeof input==='string'?input:input?.url||'';if(url.includes('/functions/v1/purestone-cms')){const token=await PureStoneAdminSession.token();const headers=new Headers(init.headers||{});headers.delete('X-Admin-Key');if(token)headers.set('Authorization','Bearer '+token);init={...init,headers}}return originalFetch(input,init)};const keyInput=d.querySelector('#adminKey');if(keyInput&&!keyInput.value)keyInput.value='session-auth';const notices=[...d.querySelectorAll('.notice,.cmsbar')];notices.forEach(el=>{if((el.textContent||'').toLowerCase().includes('cheie'))el.style.display='none'})}catch(e){console.warn(e)}})}document.getElementById('logout').onclick=()=>{PureStoneAdminSession.logout();location.href='./purestone-dashboard-v4.html'};boot();</script></body></html>
