<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PureStone • Lead CRM</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><script src="./purestone-admin-session.js"></script><style>:root{--bg:#f4efe7;--ink:#201d19;--muted:#7b7369;--line:rgba(32,29,25,.12);--gold:#a48058;--dark:#211e1a;--green:#2f7d57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:DM Sans,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.serif{font-family:Playfair Display,serif}.top{position:sticky;top:0;z-index:20;background:rgba(244,239,231,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Playfair Display,serif;letter-spacing:.15em}.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center}.dark{background:var(--dark);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.hero{padding:32px 0 15px}.hero h1{font-size:clamp(44px,7vw,70px);line-height:.95;margin:6px 0 10px}.gate{background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:20px;padding:16px;max-width:520px}.toolbar{display:none;grid-template-columns:1fr 170px auto auto;gap:8px;margin:16px 0}.toolbar.show{display:grid}.toolbar input,.toolbar select,.lead select,.lead input,.lead textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px}.count{grid-column:1/-1;font-size:10px;color:var(--muted)}.list{display:grid;gap:11px;padding-bottom:70px}.lead{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:1fr 265px;gap:16px}.lead h3{font-family:Playfair Display,serif;font-size:27px;margin:0 0 5px}.meta{font-size:9px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}.message{font-size:11px;color:#625a52;line-height:1.6;margin-top:11px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{font-size:8px;padding:5px 7px;background:#eee5d9;border-radius:999px}.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.file{font-size:8px;padding:6px 8px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:inherit;background:#fff}.side{display:grid;gap:7px;align-content:start}.side input,.side select,.side textarea{width:100%;font-size:10px}.side textarea{min-height:80px}.saved{font-size:9px;color:var(--green)}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:760px){.lead{grid-template-columns:1fr}.toolbar.show{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.nav .light{display:none}}</style></head><body><header class="top"><div class="wrap nav"><div class="brand">PURESTONE <span style="font-family:DM Sans;font-size:8px;color:var(--muted)">LEAD CRM</span></div><div><a class="btn light" href="./purestone-dashboard-v4.html">Dashboard</a> <a class="btn dark" href="./purestone-offer-builder.html">Ofertă nouă</a></div></div></header><main class="wrap"><section class="hero"><div style="font-size:9px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;font-weight:700">Vânzări</div><h1 class="serif">Cereri de ofertă.</h1><p style="color:var(--muted)">Status, valoare, notițe, fișiere și ofertare într-un singur flux.</p></section><section class="gate" id="gate">Autentificare Admin necesară. <a href="./purestone-dashboard-v4.html">Mergi la Dashboard</a></section><div class="toolbar" id="toolbar"><input id="search" placeholder="Caută nume, telefon, material..."><select id="filter"><option value="">Toate statusurile</option><option value="new">Nou</option><option value="contacted">Contactat</option><option value="measurement">Măsurătoare</option><option value="offer">Ofertă</option><option value="won">Câștigat</option><option value="lost">Pierdut</option></select><button class="btn light" id="export">Export CSV</button><button class="btn dark" id="refresh">Actualizează</button><span class="count"><b id="count">0</b> cereri</span></div><section class="list" id="list"></section></main><script>const $=s=>document.querySelector(s),API='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-leads-admin';let leads=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>{try{return new Intl.DateTimeFormat('ro-RO',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d))}catch{return d}};const statuses=[['new','Nou'],['contacted','Contactat'],['measurement','Măsurătoare'],['offer','Ofertă'],['won','Câștigat'],['lost','Pierdut']];function filtered(){const q=$('#search').value.toLowerCase(),s=$('#filter').value;return leads.filter(x=>(!s||x.status===s)&&(!q||`${x.customer_name} ${x.phone} ${x.email||''} ${x.material_name||''} ${(x.selected_materials||[]).join(' ')} ${x.city||''}`.toLowerCase().includes(q)))}function render(){const a=filtered();$('#count').textContent=a.length;$('#list').innerHTML=a.length?a.map(x=>`<article class="lead" data-id="${esc(x.id)}"><div><div class="meta"><span>${fmt(x.created_at)}</span><span>${esc(x.source)}</span><span>${esc(x.city||'')}</span></div><h3>${esc(x.customer_name)}</h3><div class="meta"><a href="tel:${esc(x.phone)}" style="color:var(--gold);font-weight:700">${esc(x.phone)}</a>${x.email?`<span>${esc(x.email)}</span>`:''}${x.estimated_m2?`<span>${esc(x.estimated_m2)} mp</span>`:''}</div>${x.material_name?`<div style="margin-top:9px"><b>${esc(x.material_name)}</b></div>`:''}${x.selected_materials?.length?`<div class="tags">${x.selected_materials.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div>`:''}${x.message?`<div class="message">${esc(x.message)}</div>`:''}${x.files?.length?`<div class="files">${x.files.map((f,i)=>`<a class="file" target="_blank" href="${esc(f.url)}">Fișier ${i+1}</a>`).join('')}</div>`:''}</div><div class="side"><a class="btn dark" href="./purestone-offer-builder.html?lead=${encodeURIComponent(x.id)}">Generează ofertă</a><a class="btn light" target="_blank" href="https://wa.me/${esc(String(x.phone).replace(/\D/g,''))}">WhatsApp</a><select data-status>${statuses.map(([v,l])=>`<option value="${v}" ${x.status===v?'selected':''}>${l}</option>`).join('')}</select><input data-value type="number" min="0" placeholder="Valoare estimată lei" value="${x.estimated_value??''}"><textarea data-notes placeholder="Notițe interne">${esc(x.notes||'')}</textarea><button class="btn light" data-save>Salvează CRM</button><span class="saved" data-msg></span></div></article>`).join(''):'<div class="empty">Nu există cereri pentru filtrul ales.</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveCard(b.closest('.lead')))}async function saveCard(card){const msg=card.querySelector('[data-msg]');msg.textContent='Se salvează...';try{const r=await fetch(API,{method:'PATCH',headers:{'Content-Type':'application/json',...(await PureStoneAdminSession.headers())},body:JSON.stringify({id:card.dataset.id,status:card.querySelector('[data-status]').value,estimated_value:card.querySelector('[data-value]').value,notes:card.querySelector('[data-notes]').value})}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');Object.assign(leads.find(x=>x.id===card.dataset.id)||{},j.lead);msg.textContent='Salvat ✓'}catch(e){msg.textContent=e.message}}async function load(){if(!await PureStoneAdminSession.verify().catch(()=>false))return;$('#gate').style.display='none';$('#toolbar').classList.add('show');const r=await fetch(API,{headers:await PureStoneAdminSession.headers()}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');leads=j.leads||[];render()}function exportCsv(){const rows=[['Data','Nume','Telefon','Email','Localitate','Material','MP','Valoare','Status','Notite'],...leads.map(x=>[x.created_at,x.customer_name,x.phone,x.email||'',x.city||'',x.material_name||'',x.estimated_m2||'',x.estimated_value||'',x.status,x.notes||''])];const text=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='purestone-leads.csv';a.click();URL.revokeObjectURL(url)}$('#search').oninput=render;$('#filter').onchange=render;$('#refresh').onclick=()=>load().catch(e=>alert(e.message));$('#export').onclick=exportCsv;load().catch(e=>{$('#gate').textContent=e.message});</script></body></html>
