<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PureStone • Lead Inbox</title><meta name="theme-color" content="#f4efe7"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><style>:root{--bg:#f4efe7;--paper:#fbf8f3;--ink:#201d19;--muted:#7b7369;--line:rgba(32,29,25,.12);--gold:#a48058;--dark:#211e1a;--green:#2f7d57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.serif{font-family:"Playfair Display",serif}.top{position:sticky;top:0;z-index:20;background:rgba(244,239,231,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.topin{min-height:70px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-family:"Playfair Display",serif;letter-spacing:.15em;font-weight:600}.btn{border:0;border-radius:999px;padding:11px 15px;font-weight:700;cursor:pointer}.dark{background:var(--dark);color:#fff}.light{background:#fff;border:1px solid var(--line)}.hero{padding:34px 0 18px}.hero h1{font-size:clamp(42px,7vw,70px);line-height:.95;margin:8px 0 12px}.hero p{color:var(--muted)}.login,.card{background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:22px;padding:18px}.login{max-width:520px;margin:20px 0}.login input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;margin:8px 0}.toolbar{display:none;justify-content:space-between;gap:10px;align-items:center;margin:18px 0}.toolbar.show{display:flex}.count{font-size:11px;color:var(--muted)}.list{display:grid;gap:12px;padding-bottom:70px}.lead{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px}.lead h3{font-family:"Playfair Display",serif;font-size:24px;margin:0 0 5px}.meta{font-size:10px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.msg{font-size:12px;color:#5f584f;line-height:1.6;margin-top:12px}.phone{font-weight:700;color:var(--gold)}.lead-actions{display:flex;flex-direction:column;gap:8px;min-width:155px}.lead-actions a,.lead-actions select{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-size:10px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:700px){.lead{grid-template-columns:1fr}.lead-actions{min-width:0}.toolbar{align-items:flex-start;flex-direction:column}.topin{padding:10px 0}.topin .light{display:none}}</style></head><body><header class="top"><div class="wrap topin"><div class="brand">PURESTONE <span style="font-family:DM Sans;font-size:9px;color:var(--muted);letter-spacing:.1em">LEAD INBOX</span></div><div><a class="btn light" href="./purestone-admin.html">CMS</a> <a class="btn dark" href="./purestone.html">Site</a></div></div></header><main class="wrap"><section class="hero"><div style="font-size:10px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-weight:700">Privat</div><h1 class="serif">Cereri de ofertă.</h1><p>Lead-urile trimise din paginile de materiale apar aici.</p></section><section class="login" id="login"><b>Cheie administrare</b><input id="key" type="password" placeholder="Cheia PureStone"><button class="btn dark" id="connect">Conectează</button><div id="loginStatus" style="font-size:10px;color:var(--muted);margin-top:8px"></div></section><div class="toolbar" id="toolbar"><span class="count"><b id="count">0</b> cereri</span><button class="btn light" id="refresh">Actualizează</button></div><section class="list" id="list"></section></main><script>const $=s=>document.querySelector(s),URL='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-leads-admin';let adminKey=sessionStorage.getItem('purestone-admin-key')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(d){try{return new Intl.DateTimeFormat('ro-RO',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d))}catch{return d}}async function load(){if(!adminKey)return;$('#loginStatus').textContent='Se conectează...';try{const r=await fetch(URL,{headers:{'x-admin-key':adminKey}}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');sessionStorage.setItem('purestone-admin-key',adminKey);$('#login').style.display='none';$('#toolbar').classList.add('show');$('#count').textContent=j.leads.length;$('#list').innerHTML=j.leads.length?j.leads.map(x=>`<article class="lead"><div><div class="meta"><span>${fmt(x.created_at)}</span><span>•</span><span>${esc(x.source)}</span><span>•</span><span>${esc(x.status)}</span></div><h3>${esc(x.customer_name)}</h3><div class="meta"><a class="phone" href="tel:${esc(x.phone)}">${esc(x.phone)}</a>${x.email?`<span>• ${esc(x.email)}</span>`:''}${x.estimated_m2?`<span>• ${esc(x.estimated_m2)} mp</span>`:''}</div>${x.material_name?`<div style="margin-top:10px"><b>${esc(x.material_name)}</b></div>`:''}${x.message?`<div class="msg">${esc(x.message)}</div>`:''}</div><div class="lead-actions"><a href="tel:${esc(x.phone)}">Sună</a><a target="_blank" href="https://wa.me/${esc(String(x.phone).replace(/\D/g,''))}">WhatsApp</a><select data-id="${esc(x.id)}"><option value="new" ${x.status==='new'?'selected':''}>Nou</option><option value="contacted" ${x.status==='contacted'?'selected':''}>Contactat</option><option value="measurement" ${x.status==='measurement'?'selected':''}>Măsurătoare</option><option value="offer" ${x.status==='offer'?'selected':''}>Ofertă</option><option value="won" ${x.status==='won'?'selected':''}>Câștigat</option><option value="lost" ${x.status==='lost'?'selected':''}>Pierdut</option></select></div></article>`).join(''):'<div class="empty">Nu există încă cereri.</div>';document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=async()=>{await fetch(URL,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({id:s.dataset.id,status:s.value})})});$('#loginStatus').textContent=''}catch(e){$('#loginStatus').textContent=e.message;$('#login').style.display='block'}}$('#connect').onclick=()=>{adminKey=$('#key').value.trim();load()};$('#refresh').onclick=load;if(adminKey)load();if(window.lucide)lucide.createIcons();</script></body></html>
