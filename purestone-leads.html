<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PureStone • Lead CRM</title><meta name="theme-color" content="#f4efe7"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>:root{--bg:#f4efe7;--paper:#fbf8f3;--ink:#201d19;--muted:#7b7369;--line:rgba(32,29,25,.12);--gold:#a48058;--dark:#211e1a;--green:#2f7d57;--red:#9b3b36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:DM Sans,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.serif{font-family:Playfair Display,serif}.top{position:sticky;top:0;z-index:20;background:rgba(244,239,231,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.topin{min-height:70px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-family:Playfair Display,serif;letter-spacing:.15em;font-weight:600}.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.dark{background:var(--dark);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.hero{padding:34px 0 18px}.hero h1{font-size:clamp(42px,7vw,70px);line-height:.95;margin:8px 0 12px}.hero p{color:var(--muted)}.login,.lead{background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:22px;padding:18px}.login{max-width:520px;margin:20px 0}.login input,.toolbar input,.toolbar select,.lead select,.lead input,.lead textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:inherit}.login input{width:100%;margin:8px 0}.toolbar{display:none;grid-template-columns:1fr 170px auto auto;gap:8px;align-items:center;margin:18px 0}.toolbar.show{display:grid}.count{font-size:10px;color:var(--muted);grid-column:1/-1}.list{display:grid;gap:12px;padding-bottom:70px}.lead{display:grid;grid-template-columns:1fr 260px;gap:16px}.lead h3{font-family:Playfair Display,serif;font-size:26px;margin:0 0 5px}.meta{font-size:10px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.msg{font-size:12px;color:#5f584f;line-height:1.6;margin-top:12px}.phone{font-weight:700;color:var(--gold)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:9px;background:#eee5d9;border-radius:999px;padding:6px 8px}.side{display:grid;gap:8px;align-content:start}.side textarea{min-height:85px;resize:vertical}.side input,.side select,.side textarea{width:100%;font-size:10px}.side a{text-align:center}.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.file{font-size:9px;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 8px}.saved{color:var(--green);font-size:9px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:760px){.lead{grid-template-columns:1fr}.toolbar.show{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.topin{padding:10px 0}.topin .light{display:none}.hero{padding-top:24px}}</style></head><body><header class="top"><div class="wrap topin"><div class="brand">PURESTONE <span style="font-family:DM Sans;font-size:9px;color:var(--muted);letter-spacing:.1em">LEAD CRM</span></div><div><a class="btn light" href="./purestone-dashboard.html">Dashboard</a> <a class="btn dark" href="./purestone.html">Site</a></div></div></header><main class="wrap"><section class="hero"><div style="font-size:10px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-weight:700">Privat</div><h1 class="serif">Cereri de ofertă.</h1><p>Status, valoare estimată, notițe, fișiere și export CSV.</p></section><section class="login" id="login"><b>Cheie administrare</b><input id="key" type="password" placeholder="Cheia PureStone"><button class="btn dark" id="connect">Conectează</button><div id="loginStatus" style="font-size:10px;color:var(--muted);margin-top:8px"></div></section><div class="toolbar" id="toolbar"><input id="search" placeholder="Caută nume, telefon, material..."><select id="statusFilter"><option value="">Toate statusurile</option><option value="new">Nou</option><option value="contacted">Contactat</option><option value="measurement">Măsurătoare</option><option value="offer">Ofertă</option><option value="won">Câștigat</option><option value="lost">Pierdut</option></select><button class="btn light" id="export">Export CSV</button><button class="btn dark" id="refresh">Actualizează</button><span class="count"><b id="count">0</b> cereri afișate</span></div><section class="list" id="list"></section></main><script>const $=s=>document.querySelector(s),URL='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-leads-admin';let adminKey=sessionStorage.getItem('purestone-admin-key')||'',leads=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(d){try{return new Intl.DateTimeFormat('ro-RO',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d))}catch{return d}}function filtered(){const q=$('#search').value.toLowerCase(),s=$('#statusFilter').value;return leads.filter(x=>(!s||x.status===s)&&(!q||`${x.customer_name} ${x.phone} ${x.email||''} ${x.material_name||''} ${(x.selected_materials||[]).join(' ')} ${x.city||''}`.toLowerCase().includes(q)))}function statusOptions(s){return [['new','Nou'],['contacted','Contactat'],['measurement','Măsurătoare'],['offer','Ofertă'],['won','Câștigat'],['lost','Pierdut']].map(([v,l])=>`<option value="${v}" ${s===v?'selected':''}>${l}</option>`).join('')}function render(){const a=filtered();$('#count').textContent=a.length;$('#list').innerHTML=a.length?a.map(x=>`<article class="lead" data-id="${esc(x.id)}"><div><div class="meta"><span>${fmt(x.created_at)}</span><span>•</span><span>${esc(x.source)}</span><span>•</span><span>${esc(x.city||'fără localitate')}</span></div><h3>${esc(x.customer_name)}</h3><div class="meta"><a class="phone" href="tel:${esc(x.phone)}">${esc(x.phone)}</a>${x.email?`<span>• ${esc(x.email)}</span>`:''}${x.estimated_m2?`<span>• ${esc(x.estimated_m2)} mp</span>`:''}</div>${x.material_name?`<div style="margin-top:10px"><b>${esc(x.material_name)}</b></div>`:''}${Array.isArray(x.selected_materials)&&x.selected_materials.length?`<div class="tags">${x.selected_materials.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div>`:''}${x.message?`<div class="msg">${esc(x.message)}</div>`:''}${x.files?.length?`<div class="files">${x.files.map((f,i)=>`<a class="file" target="_blank" rel="noopener" href="${esc(f.url)}">Fișier ${i+1}</a>`).join('')}</div>`:''}</div><div class="side"><a class="btn light" href="tel:${esc(x.phone)}">Sună</a><a class="btn light" target="_blank" rel="noopener" href="https://wa.me/${esc(String(x.phone).replace(/\D/g,''))}">WhatsApp</a><select data-status>${statusOptions(x.status)}</select><input data-value type="number" min="0" step="1" placeholder="Valoare estimată (lei)" value="${x.estimated_value??''}"><textarea data-notes placeholder="Notițe interne...">${esc(x.notes||'')}</textarea><button class="btn dark" data-save>Salvează</button><span class="saved" data-saved></span></div></article>`).join(''):'<div class="empty">Nu există cereri pentru filtrul ales.</div>';document.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=async()=>{const card=btn.closest('.lead'),id=card.dataset.id,payload={id,status:card.querySelector('[data-status]').value,estimated_value:card.querySelector('[data-value]').value,notes:card.querySelector('[data-notes]').value},msg=card.querySelector('[data-saved]');msg.textContent='Se salvează...';try{const r=await fetch(URL,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');msg.textContent='Salvat ✓';const local=leads.find(x=>x.id===id);if(local)Object.assign(local,j.lead)}catch(e){msg.textContent=e.message}})}async function load(){if(!adminKey)return;$('#loginStatus').textContent='Se conectează...';try{const r=await fetch(URL,{headers:{'x-admin-key':adminKey}}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');leads=j.leads||[];sessionStorage.setItem('purestone-admin-key',adminKey);$('#login').style.display='none';$('#toolbar').classList.add('show');render();$('#loginStatus').textContent=''}catch(e){$('#loginStatus').textContent=e.message;$('#login').style.display='block'}}function csv(){const rows=[['Data','Nume','Telefon','Email','Localitate','Material','MP','Valoare','Status','Notite']].concat(leads.map(x=>[x.created_at,x.customer_name,x.phone,x.email||'',x.city||'',x.material_name||'',x.estimated_m2||'',x.estimated_value||'',x.status,x.notes||'']));const text=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='purestone-leads.csv';a.click();URL.revokeObjectURL(a.href)}$('#connect').onclick=()=>{adminKey=$('#key').value.trim();load()};$('#refresh').onclick=load;$('#search').oninput=render;$('#statusFilter').onchange=render;$('#export').onclick=csv;if(adminKey)load();</script></body></html>
