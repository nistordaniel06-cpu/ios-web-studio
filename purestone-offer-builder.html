<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PureStone • Offer Builder</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><script src="./purestone-admin-session.js"></script><style>:root{--bg:#f4efe7;--paper:#fbf8f3;--ink:#201d19;--muted:#7b7369;--line:rgba(32,29,25,.12);--gold:#a48058;--dark:#211e1a;--green:#2f7d57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:DM Sans,sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.serif{font-family:Playfair Display,serif}.top{border-bottom:1px solid var(--line);background:rgba(244,239,231,.92);backdrop-filter:blur(20px)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Playfair Display,serif;letter-spacing:.15em}.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.dark{background:var(--dark);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.hero{padding:32px 0 18px}.hero h1{font-size:clamp(44px,7vw,68px);line-height:.95;margin:5px 0 10px}.layout{display:grid;grid-template-columns:.7fr 1.3fr;gap:12px;padding-bottom:70px}.box{background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:24px;padding:18px}.field{margin-bottom:9px}.field label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:inherit}.field textarea{min-height:95px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.line{display:grid;grid-template-columns:1fr 72px 72px 115px 36px;gap:6px;margin-bottom:7px}.line input{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px}.line button{border:0;border-radius:10px;background:#eee5d9}.totals{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.sum{display:flex;justify-content:space-between;padding:5px 0;font-size:11px}.sum.total{font-family:Playfair Display,serif;font-size:25px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.status{font-size:10px;color:var(--muted);margin-top:9px}.ok{color:var(--green);font-weight:700}@media(max-width:800px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}.line{grid-template-columns:1fr 54px 85px 34px}.line .unit{display:none}.nav .light{display:none}}</style></head><body><header class="top"><div class="wrap nav"><div class="brand">PURESTONE <span style="font-family:DM Sans;font-size:9px;color:var(--muted)">OFFER BUILDER</span></div><div><a class="btn light" href="./purestone-dashboard-v4.html">Dashboard</a> <a class="btn dark" href="./purestone-leads.html">CRM</a></div></div></header><main class="wrap"><section class="hero"><div style="font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:.15em;font-weight:700">Ofertare</div><h1 class="serif">Construiește oferta.</h1></section><section class="layout"><aside class="box"><div class="row"><div class="field"><label>Client *</label><input id="customer_name"></div><div class="field"><label>Telefon</label><input id="customer_phone"></div><div class="field"><label>Email</label><input id="customer_email" type="email"></div><div class="field"><label>Valabil până la</label><input id="valid_until" type="date"></div></div><div class="field"><label>Status</label><select id="offer_status"><option value="draft">Draft</option><option value="sent">Trimisă</option><option value="accepted">Acceptată</option><option value="rejected">Respinsă</option><option value="expired">Expirată</option></select></div><div class="field"><label>TVA %</label><input id="vat" type="number" value="21" min="0" max="100"></div><div class="field"><label>Note / condiții</label><textarea id="notes" placeholder="Transport, montaj, termen estimat, condiții speciale..."></textarea></div></aside><article class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 class="serif" style="font-size:30px;margin:0">Poziții ofertă</h2><button class="btn light" id="add">+ Linie</button></div><div id="lines" style="margin-top:14px"></div><div class="totals"><div class="sum"><span>Subtotal</span><b id="subtotal">0 lei</b></div><div class="sum"><span>TVA</span><b id="vatValue">0 lei</b></div><div class="sum total"><span>Total</span><b id="total">0 lei</b></div></div><div class="actions"><button class="btn dark" id="save">Salvează oferta</button><a class="btn light" id="open" target="_blank" style="display:none">Deschide oferta client</a><button class="btn light" id="copy" style="display:none">Copiază link</button></div><div class="status" id="status"></div></article></section></main><script>const $=s=>document.querySelector(s),API='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-v4-admin',params=new URLSearchParams(location.search);let offerId=params.get('offer')||'',leadId=params.get('lead')||'',projectId=params.get('project')||'',b2bUserId=params.get('user')||'',publicUrl='';const money=n=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:'RON',maximumFractionDigits:2}).format(Number(n||0));function line(d={}){const el=document.createElement('div');el.className='line';el.innerHTML=`<input class="desc" placeholder="Ex: Taj Mahal — blat bucătărie" value="${String(d.description||'').replace(/"/g,'&quot;')}"><input class="qty" type="number" min="0" step="0.01" value="${d.qty??1}"><input class="unit" value="${d.unit||'buc'}"><input class="price" type="number" min="0" step="0.01" value="${d.unit_price??0}"><button type="button">×</button>`;el.querySelector('button').onclick=()=>{el.remove();calc()};el.querySelectorAll('input').forEach(i=>i.oninput=calc);$('#lines').appendChild(el);calc()}function items(){return [...document.querySelectorAll('.line')].map(x=>({description:x.querySelector('.desc').value,qty:Number(x.querySelector('.qty').value)||0,unit:x.querySelector('.unit').value||'buc',unit_price:Number(x.querySelector('.price').value)||0})).filter(x=>x.description&&x.qty>0)}function calc(){const sub=items().reduce((a,x)=>a+x.qty*x.unit_price,0),vat=Number($('#vat').value)||0,total=sub*(1+vat/100);$('#subtotal').textContent=money(sub);$('#vatValue').textContent=money(total-sub);$('#total').textContent=money(total)}$('#vat').oninput=calc;$('#add').onclick=()=>line();async function headers(){return {'Content-Type':'application/json',...(await PureStoneAdminSession.headers())}}function setPublic(o){publicUrl=new URL('./offer.html',location.href);publicUrl.searchParams.set('id',o.id);publicUrl.searchParams.set('token',o.public_token);publicUrl=publicUrl.href;$('#open').href=publicUrl;$('#open').style.display='inline-flex';$('#copy').style.display='inline-flex'}function fillOffer(o){$('#customer_name').value=o.customer_name||'';$('#customer_phone').value=o.customer_phone||'';$('#customer_email').value=o.customer_email||'';$('#valid_until').value=o.valid_until||'';$('#offer_status').value=o.status||'draft';$('#vat').value=o.vat_percent??21;$('#notes').value=o.notes||'';$('#lines').innerHTML='';(Array.isArray(o.items)?o.items:[]).forEach(line);if(!o.items?.length)line();leadId=o.lead_id||leadId;projectId=o.project_id||projectId;b2bUserId=o.b2b_user_id||b2bUserId;setPublic(o);calc()}async function loadExisting(){if(!offerId)return false;const r=await fetch(API,{headers:await PureStoneAdminSession.headers()}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Nu pot încărca oferta.');const o=(j.offers||[]).find(x=>x.id===offerId);if(!o)throw new Error('Oferta nu a fost găsită.');fillOffer(o);return true}async function loadLead(){if(!leadId)return;try{const r=await fetch(API+'?view=lead&id='+encodeURIComponent(leadId),{headers:await PureStoneAdminSession.headers()}),j=await r.json();if(j.lead){$('#customer_name').value=j.lead.customer_name||'';$('#customer_phone').value=j.lead.phone||'';$('#customer_email').value=j.lead.email||'';if(j.lead.material_name)line({description:j.lead.material_name,qty:j.lead.estimated_m2||1,unit:'mp',unit_price:0})}}catch{}}async function save(){const st=$('#status');st.textContent='Se salvează...';try{if(!await PureStoneAdminSession.verify())throw new Error('Autentifică-te întâi în Dashboard.');const payload={action:offerId?'update_offer':'create_offer',id:offerId||undefined,lead_id:leadId||null,b2b_user_id:b2bUserId||null,project_id:projectId||null,customer_name:$('#customer_name').value,customer_phone:$('#customer_phone').value,customer_email:$('#customer_email').value,valid_until:$('#valid_until').value||null,status:$('#offer_status').value,vat_percent:Number($('#vat').value),notes:$('#notes').value,items:items()};const r=await fetch(API,{method:'POST',headers:await headers(),body:JSON.stringify(payload)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');offerId=j.offer.id;setPublic(j.offer);st.className='status ok';st.textContent='Oferta a fost salvată ✓';history.replaceState(null,'','?offer='+encodeURIComponent(offerId))}catch(e){st.className='status';st.textContent=e.message}}$('#save').onclick=save;$('#copy').onclick=async()=>{if(publicUrl){await navigator.clipboard.writeText(publicUrl);$('#status').textContent='Link copiat ✓'}};(async()=>{if(!await PureStoneAdminSession.verify().catch(()=>false)){location.href='./purestone-dashboard-v4.html';return}const d=new Date();d.setDate(d.getDate()+14);$('#valid_until').value=d.toISOString().slice(0,10);try{const loaded=await loadExisting();if(!loaded)await loadLead()}catch(e){$('#status').textContent=e.message}if(!document.querySelector('.line'))line()})();</script></body></html>
