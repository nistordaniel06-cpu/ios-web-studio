<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PureStone • Product Admin</title><meta name="theme-color" content="#f4efe7"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="./manifest/products_manifest.js"></script><style>:root{--bg:#f4efe7;--paper:#fbf8f3;--ink:#201d19;--muted:#7b7369;--line:rgba(32,29,25,.12);--gold:#a48058;--dark:#211e1a;--green:#2f7d57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:DM Sans,sans-serif}.wrap{width:min(1240px,calc(100% - 28px));margin:auto}.serif{font-family:Playfair Display,serif}.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.dark{background:var(--dark);color:#fff}.light{background:#fff;border:1px solid var(--line)}.gold{background:var(--gold);color:#fff}header{position:sticky;top:0;z-index:30;background:rgba(244,239,231,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:Playfair Display,serif;letter-spacing:.15em;font-weight:600}.login{max-width:520px;margin:36px auto;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:22px;padding:20px}.login input,.field input,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px}.layout{display:none;grid-template-columns:340px 1fr;gap:14px;padding:28px 0 70px}.layout.show{display:grid}.side,.editor{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:24px;padding:14px}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.items{max-height:72vh;overflow:auto;margin-top:10px;display:grid;gap:6px}.item{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer}.item.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(164,128,88,.12)}.item b{display:block;font-size:11px}.item small{color:var(--muted);font-size:9px}.editor h1{font-size:38px;margin:4px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:5px}.field textarea{min-height:85px}.switches{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}.switches label{font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.status{font-size:10px;color:var(--muted);margin-top:10px}.ok{color:var(--green);font-weight:700}@media(max-width:850px){.layout.show{grid-template-columns:1fr}.items{max-height:280px}.grid{grid-template-columns:1fr}.nav{padding:10px 0;align-items:flex-start}.nav .light{display:none}}</style></head><body><header><div class="wrap nav"><div class="brand">PURESTONE <span style="font-family:DM Sans;font-size:9px;color:var(--muted);letter-spacing:.08em">PRODUCT ADMIN</span></div><div><a class="btn light" href="./purestone-dashboard.html">Dashboard</a> <a class="btn dark" href="./catalog.html" target="_blank">Vezi catalogul</a></div></div></header><main class="wrap"><section class="login" id="login"><h2 class="serif" style="font-size:30px;margin:0 0 10px">Conectare catalog</h2><input id="key" type="password" placeholder="Cheie administrare"><button class="btn dark" id="connect" style="margin-top:10px">Conectează</button><div class="status" id="loginStatus"></div></section><section class="layout" id="layout"><aside class="side"><input class="search" id="search" placeholder="Caută material..."><div class="items" id="items"></div></aside><section class="editor"><div style="font-size:9px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase">Editare produs</div><h1 class="serif" id="heading">Alege un material</h1><form id="form"><div class="grid"><div class="field"><label>Nume</label><input name="title"></div><div class="field"><label>Brand</label><input name="brand"></div><div class="field"><label>Material</label><input name="material"></div><div class="field"><label>Gamă cromatică</label><input name="color_family"></div><div class="field"><label>Preț / etichetă</label><input name="price_label" placeholder="Ex: de la 2.450 lei/mp"></div><div class="field"><label>Finisaj</label><input name="finish"></div><div class="field"><label>Grosime</label><input name="thickness"></div><div class="field"><label>Dimensiune placă</label><input name="slab_size"></div><div class="field" style="grid-column:1/-1"><label>Recomandare mobilier</label><textarea name="furniture_pairing"></textarea></div><div class="field"><label>Categorie utilizare</label><input name="furniture_category"></div><div class="field"><label>Ordine</label><input name="sort_order" type="number"></div><div class="field" style="grid-column:1/-1"><label>Imagine produs</label><input name="image_url" placeholder="URL imagine"><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" style="margin-top:7px"></div></div><div class="switches"><label><input name="is_featured" type="checkbox"> Featured</label><label><input name="is_active" type="checkbox" checked> Activ în catalog</label></div><div class="actions"><button class="btn dark" type="submit">Salvează produs</button><button class="btn gold" type="button" id="upload">Încarcă imagine</button><button class="btn light" type="button" id="reset">Revino la datele originale</button></div><div class="status" id="status"></div></form></section></section></main><script>const $=s=>document.querySelector(s),API='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-products-admin',CMS='https://bcedyacdepzhqwleizfl.supabase.co/functions/v1/purestone-cms',base=(typeof TOP_BLAT_CATALOG!=='undefined'&&Array.isArray(TOP_BLAT_CATALOG))?TOP_BLAT_CATALOG:[];let key=sessionStorage.getItem('purestone-admin-key')||'',overrides=new Map(),current=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(method,body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-admin-key':key},body:body?JSON.stringify(body):undefined}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Eroare');return j}function merged(p){return {...p,...(overrides.get(p.slug)||{})}}function renderList(){const q=$('#search').value.toLowerCase();$('#items').innerHTML=base.filter(p=>!q||`${p.title} ${p.brand} ${p.slug}`.toLowerCase().includes(q)).map(p=>{const x=merged(p);return `<button class="item ${current?.slug===p.slug?'active':''}" data-slug="${esc(p.slug)}"><b>${esc(x.title)}</b><small>${esc(x.brand||'')} • ${esc(x.material||'')}</small></button>`}).join('');document.querySelectorAll('[data-slug]').forEach(b=>b.onclick=()=>select(b.dataset.slug))}function select(slug){const p=base.find(x=>x.slug===slug);if(!p)return;current=merged(p);$('#heading').textContent=current.title;for(const n of ['title','brand','material','color_family','price_label','finish','thickness','slab_size','furniture_pairing','furniture_category','sort_order','image_url']){const el=$(`[name="${n}"]`);if(el)el.value=current[n]??''}$('[name="is_featured"]').checked=!!current.is_featured;$('[name="is_active"]').checked=current.is_active!==false;renderList()}async function connect(){key=$('#key').value.trim()||key;$('#loginStatus').textContent='Se conectează...';try{const j=await api('GET');overrides=new Map((j.products||[]).map(x=>[x.slug,x]));sessionStorage.setItem('purestone-admin-key',key);$('#login').style.display='none';$('#layout').classList.add('show');renderList();select(base[0]?.slug);$('#loginStatus').textContent=''}catch(e){$('#loginStatus').textContent=e.message}}$('#connect').onclick=connect;$('#search').oninput=renderList;$('#form').onsubmit=async e=>{e.preventDefault();if(!current)return;const d=Object.fromEntries(new FormData(e.currentTarget).entries());d.slug=current.slug;d.is_featured=$('[name="is_featured"]').checked;d.is_active=$('[name="is_active"]').checked;d.sort_order=Number(d.sort_order||0);$('#status').textContent='Se salvează...';try{const j=await api('PUT',d);overrides.set(current.slug,j.product);current=merged(base.find(x=>x.slug===current.slug));$('#status').className='status ok';$('#status').textContent='Salvat public.';renderList()}catch(err){$('#status').className='status';$('#status').textContent=err.message}};$('#reset').onclick=async()=>{if(!current)return;if(!confirm('Ștergi personalizările pentru acest material?'))return;try{await api('DELETE',{slug:current.slug});overrides.delete(current.slug);select(current.slug);$('#status').className='status ok';$('#status').textContent='Date originale restaurate.'}catch(e){$('#status').textContent=e.message}};$('#upload').onclick=async()=>{const f=$('#file').files[0];if(!f||!current)return alert('Alege o imagine.');if(f.size>5_000_000)return alert('Imaginea trebuie să fie sub 5 MB.');$('#status').textContent='Se încarcă imaginea...';const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});const b64=String(dataUrl).split(',')[1];try{const r=await fetch(CMS,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({mime:f.type,filename:f.name,folder:'products',dataBase64:b64})}),j=await r.json();if(!r.ok||!j.ok&&j.error)throw new Error(j.error||'Upload eșuat');$('[name="image_url"]').value=j.url;$('#status').className='status ok';$('#status').textContent='Imagine încărcată. Apasă Salvează produs.'}catch(e){$('#status').className='status';$('#status').textContent=e.message}};if(key)connect();if(window.lucide)lucide.createIcons();</script></body></html>
