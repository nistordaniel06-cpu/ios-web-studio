<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f0f"><title>SalonForge • Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><style>:root{--bg:#efefea;--paper:#fafaf7;--ink:#0d0f0f;--muted:#747873;--line:rgba(13,15,15,.1);--lime:#c8ff38}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"DM Sans",sans-serif;color:var(--ink)}button,a{font:inherit;color:inherit}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#0d0f0f;color:white;padding:24px 18px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;gap:11px;align-items:center;font-family:"Manrope";font-weight:800}.mark{width:36px;height:36px;background:#1b1e1d;border-radius:11px;display:grid;place-items:center;color:var(--lime)}.nav{display:grid;gap:6px}.nav button,.nav a{border:0;background:transparent;color:#a6aaa5;text-decoration:none;text-align:left;padding:11px 12px;border-radius:11px;display:flex;gap:10px;align-items:center;font-size:12px}.nav .active{background:#202321;color:white}.nav svg{width:16px}.side small{color:#70746f;margin-top:auto}.main{padding:34px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.top h1{font-family:"Manrope";font-size:36px;letter-spacing:-.05em;margin:0}.top p{margin:5px 0 0;color:var(--muted);font-size:12px}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;text-decoration:none;font-size:11px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:27px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}.stat small{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:8px}.stat b{display:block;font-family:"Manrope";font-size:27px;margin-top:8px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:20px}.card h2{font-family:"Manrope";font-size:19px;letter-spacing:-.04em;margin:0 0 16px}.empty{border:1px dashed #c9cbc5;border-radius:15px;padding:30px;text-align:center;color:var(--muted);font-size:11px}.lead{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:15px}.lead:first-of-type{border-top:0}.lead h3{font-size:12px;margin:0 0 4px}.lead p{font-size:9px;color:var(--muted);margin:0;line-height:1.5}.badge{align-self:start;background:var(--lime);border-radius:999px;padding:6px 8px;font-size:8px;font-weight:800}.project{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid var(--line);font-size:10px}.row span{color:var(--muted)}.row b{text-align:right}.items{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{background:#eceee7;border-radius:999px;padding:7px 9px;font-size:9px}.danger{border:0;background:#1a1d1c;color:white;border-radius:12px;padding:10px 13px;font-size:9px;font-weight:700;margin-top:15px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:15px;display:block}.brand{margin-bottom:12px}.nav{display:flex;overflow:auto}.nav small{display:none}.side small{display:none}.main{padding:22px 14px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}.top h1{font-size:30px}.top{align-items:flex-start}.back{font-size:9px}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><span class="mark">SF</span>SalonForge</div><div class="nav"><button class="active"><i data-lucide="layout-dashboard"></i>Overview</button><button><i data-lucide="folder-kanban"></i>Projects</button><button><i data-lucide="users"></i>Leads</button><button><i data-lucide="package-search"></i>Products</button><button><i data-lucide="factory"></i>Suppliers</button></div><small>SalonForge Control Center · V1 local demo</small></aside><main class="main"><div class="top"><div><h1>Control Center</h1><p>Primele date salvate din Build My Salon apar aici.</p></div><a class="back" href="./index.html">← Site public</a></div><section class="stats"><div class="stat"><small>Proiecte locale</small><b id="projectsCount">0</b></div><div class="stat"><small>Lead-uri</small><b id="leadsCount">0</b></div><div class="stat"><small>Produse salvate</small><b id="itemsCount">0</b></div><div class="stat"><small>Valoare estimată</small><b id="value">€0</b></div></section><section class="grid"><div class="card"><h2>Lead-uri recente</h2><div id="leads"></div></div><div class="card"><h2>Proiect curent</h2><div id="project"></div></div></section></main></div><script>const project=JSON.parse(localStorage.getItem('salonforge-project')||'null');const leads=JSON.parse(localStorage.getItem('salonforge-leads')||'[]');const items=JSON.parse(localStorage.getItem('salonforge-items')||'[]');document.querySelector('#projectsCount').textContent=project?1:0;document.querySelector('#leadsCount').textContent=leads.length;document.querySelector('#itemsCount').textContent=items.length;document.querySelector('#value').textContent=project?.estimate||'€0';const leadsBox=document.querySelector('#leads');if(!leads.length)leadsBox.innerHTML='<div class="empty">Nu există încă lead-uri.<br>Trimite o cerere din site-ul public.</div>';else leadsBox.innerHTML=leads.slice(0,8).map(l=>`<div class="lead"><div><h3>${l.name||'Lead fără nume'} · ${l.city||'—'}</h3><p>${l.type||'salon'} · ${l.stations||0} posturi · ${l.sqm||0} m²<br>${l.phone||l.email||'fără contact'}</p></div><span class="badge">${l.estimate||'NEW'}</span></div>`).join('');const p=document.querySelector('#project');if(!project)p.innerHTML='<div class="empty">Configurează și salvează primul proiect din Build My Salon.</div>';else p.innerHTML=`<div class="project"><div class="row"><span>Tip</span><b>${project.type}</b></div><div class="row"><span>Nivel</span><b>${project.level}</b></div><div class="row"><span>Spațiu</span><b>${project.sqm} m²</b></div><div class="row"><span>Posturi</span><b>${project.stations}</b></div><div class="row"><span>Oraș</span><b>${project.city}</b></div><div class="row"><span>Estimare</span><b>${project.estimate}</b></div><div class="items">${items.length?items.map(x=>`<span class="chip">${x}</span>`).join(''):'<span class="chip">Fără produse salvate</span>'}</div><button class="danger" onclick="clearDemo()">Resetează datele demo</button></div>`;function clearDemo(){['salonforge-project','salonforge-leads','salonforge-items'].forEach(k=>localStorage.removeItem(k));location.reload()}lucide.createIcons();</script></body></html>
